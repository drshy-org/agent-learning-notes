<text x="106" y="268" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">restart storms</text>
<text x="106" y="290" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">top 5% of files draw 38.8% of load; windows of tens </text>
<text x="106" y="306" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">of seconds</text>
<line x1="516" y1="288.0" x2="555.0" y2="288.0" stroke="#1D1D1F" stroke-width="2.5"/><polygon points="566,288.0 555.0,293.5 555.0,282.5" fill="#1D1D1F"/>
<rect x="572" y="240" width="408" height="96" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig06-olddog)"/>
<rect x="590" y="256" width="216.4" height="22" rx="11" fill="#007AFF"/><text x="698.2" y="271" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">hinted replication 3 -&gt; 128</text>
<text x="590" y="298" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">framework declares hot files at submit time</text>
<rect x="80" y="348" width="430" height="96" rx="14" fill="#FFF3E3" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig06-olddog)"/>
<circle cx="80" cy="348" r="14" fill="#FF9500" stroke="#FFFFFF" stroke-width="2.5"/><text x="80" y="352.5" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="106" y="376" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">multimodal transforms</text>
<text x="106" y="398" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">94.4% of data-loading time burns training-host CPUs</text>
<text x="106" y="414" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start"></text>
<line x1="516" y1="396.0" x2="555.0" y2="396.0" stroke="#1D1D1F" stroke-width="2.5"/><polygon points="566,396.0 555.0,401.5 555.0,390.5" fill="#1D1D1F"/>
