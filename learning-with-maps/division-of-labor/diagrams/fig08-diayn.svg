<text x="760" y="102" text-anchor="middle" font-size="10" fill="#1F7A42"><tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">I</tspan>(<tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">S</tspan> ; <tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">Z</tspan>) ↑ — readable from states</text>
<text x="760" y="130" text-anchor="middle" font-size="10.5" font-weight="700" fill="#D70015">not in tics:  <tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">I</tspan>(<tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">A</tspan> ; <tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">Z</tspan> | <tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">S</tspan>) ↓</text>
<text x="760" y="158" text-anchor="middle" font-size="10" fill="#6E6E73">otherwise stay random:  <tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">H</tspan>[<tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">A</tspan> | <tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">S</tspan>] ↑</text>
<text x="480" y="206" text-anchor="middle" font-size="10" fill="#86868B">the discriminator <tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">q</tspan><tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic" font-size="72%" baseline-shift="-18%">φ</tspan>(<tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">z</tspan> | <tspan font-family="'STIX Two Text','Cambria Math','Times New Roman',serif" font-style="italic">s</tspan>) turns this into a per-step reward</text>
