<svg viewBox="0 0 1060 500" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,sans-serif" role="img" aria-label="fig10-quadrant">
<defs><filter id="ds-fig10-quadrant" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.10"/></filter></defs>
<rect width="1060" height="500" rx="26" fill="#F5F5F7"/>
<rect x="28" y="26" width="783.5" height="40" rx="10" fill="#1D1D1F"/><text x="46" y="52" font-size="17" font-weight="700" fill="#FFFFFF">The agentic session is a 2x2 - LLM as object, LLM as subject (S7)</text>
<line x1="150" y1="290" x2="910" y2="290" stroke="#E2E2E7" stroke-width="2"/><line x1="530" y1="120" x2="530" y2="460" stroke="#E2E2E7" stroke-width="2"/><text x="150" y="112" font-size="13" font-weight="800" fill="#FF3B30" text-anchor="start">LLM as OBJECT (workload)</text>
<text x="910" y="112" font-size="13" font-weight="800" fill="#AF52DE" text-anchor="end">LLM as SUBJECT (tool)</text>
<rect x="170" y="140" width="330" height="130" rx="14" fill="#FFEBEA" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig10-quadrant)"/>
<circle cx="170" cy="140" r="14" fill="#FF3B30" stroke="#FFFFFF" stroke-width="2.5"/><text x="170" y="144.5" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">M</text>
<text x="194" y="168" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">Murakkab</text>
<text x="194" y="192" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">a control plane for agentic workflows:</text>
<text x="194" y="208" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">declarative spec -&gt; DAG -&gt; hourly MILP</text>
<text x="194" y="232" font-size="11.5" font-weight="600" fill="#FF3B30" text-anchor="start">2.8x fewer GPUs vs LangGraph - but no</text>
<text x="194" y="247" font-size="11.5" font-weight="600" fill="#FF3B30" text-anchor="start">production agentic trace exists yet</text>
<rect x="170" y="310" width="330" height="130" rx="14" fill="#FFEBEA" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig10-quadrant)"/>
<circle cx="170" cy="310" r="14" fill="#FF3B30" stroke="#FFFFFF" stroke-width="2.5"/><text x="170" y="314.5" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">S</text>
<text x="194" y="338" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">StriaTrace</text>
<text x="194" y="362" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">tracing rebuilt for inference: roofline over</text>
<text x="194" y="378" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">tokens, critical path = vLLM thread</text>
<text x="194" y="402" font-size="11.5" font-weight="600" fill="#FF3B30" text-anchor="start">6 months, 1,700 instances, 180M</text>
<text x="194" y="417" font-size="11.5" font-weight="600" fill="#FF3B30" text-anchor="start">requests/day, &lt;1% overhead</text>
<rect x="560" y="140" width="330" height="130" rx="14" fill="#F6ECFB" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig10-quadrant)"/>
<circle cx="560" cy="140" r="14" fill="#AF52DE" stroke="#FFFFFF" stroke-width="2.5"/><text x="560" y="144.5" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">E</text>
<text x="584" y="168" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">ECO</text>
<text x="584" y="192" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">LLM in the compiler-pass seat, fleet</text>
<text x="584" y="208" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">profiling as its guide</text>
<text x="584" y="232" font-size="11.5" font-weight="600" fill="#AF52DE" text-anchor="start">6,400+ commits landed, 99.5% rollback-free</text>
<rect x="560" y="310" width="330" height="130" rx="14" fill="#F6ECFB" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig10-quadrant)"/>
<circle cx="560" cy="310" r="14" fill="#AF52DE" stroke="#FFFFFF" stroke-width="2.5"/><text x="560" y="314.5" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">g</text>
<text x="584" y="338" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">gigiprofiler</text>
<text x="584" y="362" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">LLM proposes resource lifecycles; static +</text>
<text x="584" y="378" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">runtime analysis convict</text>
<text x="584" y="402" font-size="11.5" font-weight="600" fill="#AF52DE" text-anchor="start">raw LLMs false-positive at 45-60% - hence</text>
<text x="584" y="417" font-size="11.5" font-weight="600" fill="#AF52DE" text-anchor="start">the verifier sandwich</text>
</svg>