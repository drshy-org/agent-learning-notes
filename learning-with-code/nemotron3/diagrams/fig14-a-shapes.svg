<svg viewBox="0 0 960 434" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>A across three generations</title>
  <desc>S4 uses a full N-by-N HiPPO-initialized transition matrix, trainable via a diagonal-plus-low-rank rewrite. Mamba keeps only the diagonal (S4D form): d_inner by d_state independent decay rates. Mamba-2 keeps one scalar per head, so the per-step transition is a_t times identity — which is what lets the SSD mask L materialize as plain numbers.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
  <defs>
    <filter id="sasoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation="2.4" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  </defs>

  <rect x="4" y="4" width="952" height="426" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="42" font-size="19" font-weight="700" fill="#111827">The shrinking <tspan font-style="italic">A</tspan> — <tspan fill="#3E9E7B">from a matrix to one number per head</tspan></text>
  <text x="32" y="63" font-size="12" fill="#6B7280">each generation keeps less of the state transition; what's drawn is one step's transition acting on the state</text>

  <!-- panel 1: S4 -->
  <rect x="32" y="84" width="280" height="252" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.4" filter="url(#sasoft)"/>
  <text x="172" y="110" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4B5563">S4 · 2021</text>
  <g>
    <rect x="120" y="122" width="104" height="104" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="121" y="123" width="12" height="12" fill="#9CA3AF"/><rect x="134" y="136" width="12" height="12" fill="#9CA3AF"/>
    <rect x="147" y="149" width="12" height="12" fill="#9CA3AF"/><rect x="160" y="162" width="12" height="12" fill="#9CA3AF"/>
    <rect x="173" y="175" width="12" height="12" fill="#9CA3AF"/><rect x="186" y="188" width="12" height="12" fill="#9CA3AF"/>
    <rect x="199" y="201" width="12" height="12" fill="#9CA3AF"/><rect x="212" y="214" width="12" height="12" fill="#9CA3AF"/>
  </g>
  <text x="172" y="246" font-size="10.5" text-anchor="middle" fill="#374151">a full N × N matrix</text>
  <text x="172" y="268" font-size="10.5" text-anchor="middle" fill="#4B5563">HiPPO-initialized; trainable via a</text>
  <text x="172" y="283" font-size="10.5" text-anchor="middle" fill="#4B5563">diagonal + low-rank rewrite —</text>
  <text x="172" y="298" font-size="10.5" text-anchor="middle" fill="#4B5563">the "structured" in the name</text>
  <text x="172" y="320" font-size="10" text-anchor="middle" fill="#6B7280">every step: a full matrix hits the state</text>

  <!-- chevron 1 -->
  <path d="M320,200 L334,212 L320,224" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- panel 2: Mamba -->
  <rect x="340" y="84" width="280" height="252" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.4" filter="url(#sasoft)"/>
  <text x="480" y="110" font-size="12.5" font-weight="700" text-anchor="middle" fill="#5B3FA8">Mamba · 2023 — the S4D diagonal</text>
  <g>
    <rect x="428" y="122" width="104" height="104" rx="4" fill="#FFFFFF" stroke="#C9D1DB"/>
    <rect x="429" y="123" width="12" height="12" fill="#C9B8EE" stroke="#8A5BD6" stroke-width="0.8"/><rect x="442" y="136" width="12" height="12" fill="#C9B8EE" stroke="#8A5BD6" stroke-width="0.8"/>
    <rect x="455" y="149" width="12" height="12" fill="#C9B8EE" stroke="#8A5BD6" stroke-width="0.8"/><rect x="468" y="162" width="12" height="12" fill="#C9B8EE" stroke="#8A5BD6" stroke-width="0.8"/>
    <rect x="481" y="175" width="12" height="12" fill="#C9B8EE" stroke="#8A5BD6" stroke-width="0.8"/><rect x="494" y="188" width="12" height="12" fill="#C9B8EE" stroke="#8A5BD6" stroke-width="0.8"/>
    <rect x="507" y="201" width="12" height="12" fill="#C9B8EE" stroke="#8A5BD6" stroke-width="0.8"/><rect x="520" y="214" width="12" height="12" fill="#C9B8EE" stroke="#8A5BD6" stroke-width="0.8"/>
  </g>
  <text x="480" y="246" font-size="10.5" text-anchor="middle" fill="#374151">diagonal only — independent dials</text>
  <text x="480" y="268" font-size="10.5" text-anchor="middle" fill="#4B5563">(d_inner, d_state) decay rates:</text>
  <text x="480" y="283" font-size="10.5" text-anchor="middle" fill="#4B5563">5120 × 16 = 81,920 in mamba-2.8b</text>
  <text x="480" y="298" font-size="10.5" text-anchor="middle" fill="#9E3528">drops the low-rank term — S4D: it barely mattered</text>
  <text x="480" y="320" font-size="10" text-anchor="middle" fill="#6B7280">every step: 16 dials per channel, elementwise (scan-land)</text>

  <!-- chevron 2 -->
  <path d="M628,200 L642,212 L628,224" stroke="#9CA3AF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- panel 3: Mamba-2 / Nemotron -->
  <rect x="648" y="84" width="280" height="252" rx="12" fill="#FBFCFD" stroke="#8ECCB6" stroke-width="1.6" filter="url(#sasoft)"/>
  <text x="788" y="110" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14503D">Mamba-2 · 2024 — Nemotron's 48 blocks</text>
  <g>
    <rect x="736" y="122" width="104" height="104" rx="4" fill="#FFFFFF" stroke="#8ECCB6"/>
    <rect x="737" y="123" width="12" height="12" fill="#3E9E7B"/><rect x="750" y="136" width="12" height="12" fill="#3E9E7B"/>
    <rect x="763" y="149" width="12" height="12" fill="#3E9E7B"/><rect x="776" y="162" width="12" height="12" fill="#3E9E7B"/>
    <rect x="789" y="175" width="12" height="12" fill="#3E9E7B"/><rect x="802" y="188" width="12" height="12" fill="#3E9E7B"/>
    <rect x="815" y="201" width="12" height="12" fill="#3E9E7B"/><rect x="828" y="214" width="12" height="12" fill="#3E9E7B"/>
  </g>
  <text x="788" y="246" font-size="10.5" text-anchor="middle" fill="#14503D" font-weight="600">aₜ · I — every diagonal entry the same</text>
  <text x="788" y="268" font-size="10.5" text-anchor="middle" fill="#22624F">one scalar per head, (256,) in Ultra:</text>
  <text x="788" y="283" font-size="10.5" text-anchor="middle" fill="#22624F">arange(1, 257) → log → learn → −exp</text>
  <text x="788" y="298" font-size="10.5" text-anchor="middle" fill="#9E3528">drops per-channel decay — 64 × 128 share one aₜ</text>
  <text x="788" y="320" font-size="10" text-anchor="middle" fill="#6B7280">every step: one dial per head</text>

  <!-- payoff bar -->
  <rect x="32" y="352" width="896" height="34" rx="10" fill="#A6E1CB" stroke="#3E9E7B" stroke-width="1.4"/>
  <text x="480" y="373" font-size="11.5" text-anchor="middle" fill="#14503D">why one number wins: every mask entry aᵢ ⋯ aⱼ₊₁ becomes a plain product, L materializes as a matrix — training turns into the chunked matmuls of fig. 11</text>

  <text x="32" y="414" font-size="10" font-style="italic" fill="#C0C5CD">code: mamba mamba_simple.py · transformers modeling_nemotron_h.py</text>
  <text x="928" y="414" font-size="10" font-style="italic" text-anchor="end" fill="#C0C5CD">papers: 2111.00396 (S4) · 2008.07669 (HiPPO) · 2206.11893 (S4D) · 2312.00752 · 2405.21060</text>
</svg>
