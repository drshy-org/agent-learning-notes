<svg viewBox="0 0 840 660" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style><defs><filter id='sgsoft' x='-30%' y='-30%' width='160%' height='170%'><feDropShadow dx='0' dy='1.2' stdDeviation='2.4' flood-color='#1f2937' flood-opacity='0.09'/></filter></defs>
  <title>One block, end to end</title>
  <desc>Generating one block initializes a random canvas, then repeats a denoising step (transformer forward with self-conditioning and a bidirectional mask, temperature annealing, entropy-based acceptance, encode logits to the next self-conditioning signal) until clean or early-stopped, then commits the block to the KV cache with a causal pass and moves to the next block.</desc>
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="afp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A5BD6"/></marker>
  </defs>

  <rect x="4" y="4" width="832" height="652" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="40" font-size="19" font-weight="700" fill="#111827"><tspan fill="#3E9E7B">One block</tspan>, end to end</text>
  <text x="32" y="60" font-size="12" fill="#6B7280">The whole transformer stack runs inside step (a); the loop around it is what diffusion adds.</text>

  <!-- init -->
  <rect x="250" y="78" width="360" height="42" rx="10" fill="#FBDDD9" stroke="#D98A80" filter="url(#sgsoft)"/>
  <text x="430" y="99" font-size="12.5" font-weight="600" text-anchor="middle" fill="#9E3528">Init: random-token canvas (256)</text>
  <text x="430" y="114" font-size="11" text-anchor="middle" fill="#9E3528">+ self-conditioning signal = 0</text>
  <path d="M430,120 L430,140" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- step container -->
  <rect x="150" y="144" width="560" height="300" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-dasharray="5 4" filter="url(#sgsoft)"/>
  <text x="170" y="168" font-size="13" font-weight="700" fill="#374151">DENOISING STEP</text>
  <text x="690" y="168" font-size="11.5" text-anchor="end" fill="#6B7280">repeat until clean / early-stop</text>

  <rect x="184" y="182" width="492" height="44" rx="10" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
  <text x="430" y="200" font-size="12" font-weight="600" text-anchor="middle" fill="#14503D">(a) Transformer forward — self-cond + bidirectional mask</text>
  <text x="430" y="216" font-size="11" text-anchor="middle" fill="#1F5C49">→ logits for all 256 positions (this is the whole Gemma-4 stack)</text>
  <path d="M430,226 L430,242" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#af)"/>

  <rect x="184" y="244" width="492" height="32" rx="10" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/>
  <text x="430" y="264" font-size="11.5" text-anchor="middle" fill="#4B5563">(b) Anneal temperature by noise level (0.8 → 0.4)</text>
  <path d="M430,276 L430,290" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#af)"/>

  <rect x="184" y="292" width="492" height="32" rx="10" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/>
  <text x="430" y="312" font-size="11.5" text-anchor="middle" fill="#4B5563">(c) Accept low-entropy tokens · re-noise the rest</text>
  <path d="M430,324 L430,338" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#af)"/>

  <rect x="184" y="340" width="492" height="32" rx="10" fill="#E7D6FA" stroke="#9E62D6" filter="url(#sgsoft)"/>
  <text x="430" y="360" font-size="11.5" text-anchor="middle" fill="#56409A">(d) Encode logits → next step's self-conditioning signal</text>

  <!-- loop back arrow -->
  <path d="M184,356 L120,356 L120,204 L182,204" fill="none" stroke="#8A5BD6" stroke-width="1.6" marker-end="url(#afp)"/>
  <text x="113" y="284" font-size="11" font-weight="700" fill="#8A5BD6" transform="rotate(-90 113 284)">repeat (self-conditioned)</text>

  <!-- early stop branch -->
  <text x="718" y="392" font-size="11" fill="#9CA3AF">early stop when</text>
  <text x="718" y="407" font-size="11" fill="#9CA3AF">entropy ≤ 0.005</text>
  <text x="718" y="422" font-size="11" fill="#9CA3AF">and tokens stable</text>

  <path d="M430,444 L430,466" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- commit -->
  <rect x="250" y="468" width="360" height="44" rx="10" fill="#E7D6FA" stroke="#9E62D6" filter="url(#sgsoft)"/>
  <text x="430" y="487" font-size="12.5" font-weight="600" text-anchor="middle" fill="#56409A">Commit block → KV cache (causal pass)</text>
  <text x="430" y="503" font-size="11" text-anchor="middle" fill="#6B4FA8">now ordinary left-context for the next block</text>
  <path d="M430,512 L430,532" fill="none" stroke="#6B7280" stroke-width="1.5" marker-end="url(#af)"/>

  <!-- next block -->
  <rect x="265" y="534" width="330" height="38" rx="10" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/>
  <text x="430" y="558" font-size="12.5" font-weight="600" text-anchor="middle" fill="#4B5563">Next block →  (autoregression across blocks)</text>

  <!-- legend -->
  <line x1="32" y1="596" x2="808" y2="596" stroke="#EDEFF2"/>
  <rect x="32" y="612" width="13" height="13" rx="3" fill="#A6E1CB" stroke="#3E9E7B"/><text x="52" y="623" font-size="11" fill="#4B5563">transformer stack</text>
  <rect x="220" y="612" width="13" height="13" rx="3" fill="#EEF0F3" stroke="#B6BEC8"/><text x="240" y="623" font-size="11" fill="#4B5563">sampler logic</text>
  <rect x="360" y="612" width="13" height="13" rx="3" fill="#E7D6FA" stroke="#9E62D6"/><text x="380" y="623" font-size="11" fill="#4B5563">the weld</text>
  <text x="560" y="623" font-size="10" font-style="italic" fill="#C0C5CD">gemma/diffusion/_sampler.py · sample_next_canvas</text>
</svg>
