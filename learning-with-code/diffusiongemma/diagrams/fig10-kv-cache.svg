<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style><defs><filter id='sgsoft' x='-30%' y='-30%' width='160%' height='170%'><feDropShadow dx='0' dy='1.2' stdDeviation='2.4' flood-color='#1f2937' flood-opacity='0.09'/></filter></defs>
  <title>KV cache ring buffer</title>
  <desc>The KV cache is a fixed-size ring buffer of past keys/values. New entries are written at (end_index + i) mod cache_size. A normal LLM writes one token per step; DiffusionGemma writes a whole block per step.</desc>
  <defs><marker id="k10" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
  <rect x="4" y="4" width="892" height="322" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#111827"><tspan fill="#3E9E7B">KV cache</tspan> — a ring buffer that grows one block at a time</text>
  <text x="32" y="60" font-size="12" fill="#6B7280">remembered keys/values for past tokens, so attention isn't recomputed each step</text>

  <text x="336" y="108" font-size="11.5" font-weight="700" text-anchor="middle" fill="#3E9E7B">end_index</text>
  <path d="M336,114 L336,132" fill="none" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#k10)"/>

  <g font-size="11" text-anchor="middle">
    <rect x="60"  y="138" width="56" height="34" rx="6" fill="#EEF0F3" stroke="#B6BEC8"/><text x="88"  y="159" fill="#6B7280">ctx</text>
    <rect x="122" y="138" width="56" height="34" rx="6" fill="#EEF0F3" stroke="#B6BEC8"/><text x="150" y="159" fill="#6B7280">ctx</text>
    <rect x="184" y="138" width="56" height="34" rx="6" fill="#EEF0F3" stroke="#B6BEC8"/><text x="212" y="159" fill="#6B7280">ctx</text>
    <rect x="246" y="138" width="56" height="34" rx="6" fill="#EEF0F3" stroke="#B6BEC8"/><text x="274" y="159" fill="#6B7280">ctx</text>
    <rect x="308" y="138" width="56" height="34" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="336" y="159" fill="#14503D">blk</text>
    <rect x="370" y="138" width="56" height="34" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="398" y="159" fill="#14503D">blk</text>
    <rect x="432" y="138" width="56" height="34" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="460" y="159" fill="#14503D">blk</text>
    <rect x="494" y="138" width="56" height="34" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="522" y="159" fill="#14503D">blk</text>
    <rect x="556" y="138" width="56" height="34" rx="6" fill="#FBFCFD" stroke="#C9D1DB" stroke-dasharray="4 3"/>
    <rect x="618" y="138" width="56" height="34" rx="6" fill="#FBFCFD" stroke="#C9D1DB" stroke-dasharray="4 3"/>
    <rect x="680" y="138" width="56" height="34" rx="6" fill="#FBFCFD" stroke="#C9D1DB" stroke-dasharray="4 3"/>
    <rect x="742" y="138" width="56" height="34" rx="6" fill="#FBFCFD" stroke="#C9D1DB" stroke-dasharray="4 3"/>
  </g>
  <path d="M308,182 L550,182" fill="none" stroke="#3E9E7B" stroke-width="1.4"/>
  <text x="429" y="198" font-size="11" text-anchor="middle" fill="#3E9E7B">new block (canvas, 256 tokens) written here</text>

  <text x="60" y="238" font-size="12.5" font-family="ui-monospace, monospace" fill="#374151">slot = (end_index + i) mod cache_size</text>
  <text x="500" y="238" font-size="11.5" fill="#6B7280">← wraps around: it's a ring buffer</text>
  <text x="60" y="262" font-size="11.5" fill="#6B7280">normal LLM: <tspan font-weight="700" fill="#374151">+1 token / step</tspan>   ·   DiffusionGemma: <tspan font-weight="700" fill="#3E9E7B">+1 block / step</tspan></text>

  <line x1="32" y1="284" x2="868" y2="284" stroke="#EDEFF2"/>
  <rect x="60" y="298" width="13" height="13" rx="3" fill="#EEF0F3" stroke="#B6BEC8"/><text x="80" y="309" font-size="11" fill="#4B5563">cached context</text>
  <rect x="220" y="298" width="13" height="13" rx="3" fill="#A6E1CB" stroke="#3E9E7B"/><text x="240" y="309" font-size="11" fill="#4B5563">new block</text>
  <rect x="340" y="298" width="13" height="13" rx="3" fill="#FBFCFD" stroke="#C9D1DB"/><text x="360" y="309" font-size="11" fill="#4B5563">free slot</text>
  <text x="868" y="309" font-size="10" font-style="italic" text-anchor="end" fill="#C0C5CD">gemma4/_modules.py · Attention.init_cache</text>
</svg>
