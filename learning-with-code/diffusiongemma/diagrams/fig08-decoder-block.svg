<svg viewBox="0 0 720 666" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style><defs><filter id='sgsoft' x='-30%' y='-30%' width='160%' height='170%'><feDropShadow dx='0' dy='1.2' stdDeviation='2.4' flood-color='#1f2937' flood-opacity='0.09'/></filter></defs>
  <title>The Gemma-4 decoder layer</title>
  <desc>Each decoder layer wraps attention and the feed-forward block in a pre-norm and post-norm sandwich with residual adds. The feed-forward block is two branches summed: a dense shared MLP and a 128-expert top-8 MoE. The layer output is scaled by a learned skip_scale.</desc>
  <defs>
    <marker id="d8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
  </defs>

  <rect x="4" y="4" width="712" height="658" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="40" font-size="19" font-weight="700" fill="#111827">The Gemma-4 <tspan fill="#3E9E7B">decoder layer</tspan></text>
  <text x="32" y="60" font-size="12" fill="#6B7280">pre + post norm "sandwich" around two sub-layers, residual highways, one learned skip scale</text>

  <!-- residual highway -->
  <path d="M110,92 L110,560" fill="none" stroke="#DCC7F4" stroke-width="10" stroke-linecap="round"/>
  <text x="92" y="330" font-size="11" fill="#8A5BD6" transform="rotate(-90 92 330)">residual stream</text>

  <!-- input -->
  <rect x="300" y="80" width="200" height="32" rx="10" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/>
  <text x="400" y="100" font-size="12.5" text-anchor="middle" fill="#4B5563">input  x  (B, L, 2816)</text>
  <path d="M400,112 L400,128" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#d8)"/>

  <!-- attention sandwich -->
  <rect x="252" y="130" width="296" height="150" rx="10" fill="#FBFCFD" stroke="#C9D1DB" filter="url(#sgsoft)"/>
  <rect x="276" y="144" width="248" height="26" rx="6" fill="#F4F6F8" stroke="#D6DBE2"/><text x="400" y="161" font-size="11.5" text-anchor="middle" fill="#5B6470">pre-norm (RMSNorm)</text>
  <rect x="276" y="176" width="248" height="56" rx="10" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
  <text x="400" y="198" font-size="12.5" font-weight="600" text-anchor="middle" fill="#14503D">Attention</text>
  <text x="400" y="216" font-size="10.5" text-anchor="middle" fill="#1F5C49">RoPE · GQA 16/8 · QK-norm</text>
  <rect x="276" y="238" width="248" height="26" rx="6" fill="#F4F6F8" stroke="#D6DBE2"/><text x="400" y="255" font-size="11.5" text-anchor="middle" fill="#5B6470">post-norm (RMSNorm)</text>

  <!-- add 1 -->
  <circle cx="110" cy="304" r="13" fill="#FFFFFF" stroke="#8A5BD6" stroke-width="1.6"/><text x="110" y="309" font-size="14" text-anchor="middle" fill="#8A5BD6">+</text>
  <path d="M252,255 L150,255 Q110,255 110,291" fill="none" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#d8)"/>
  <path d="M110,317 L110,336" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#d8)"/>
  <path d="M110,338 L300,338" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#d8)"/>

  <!-- FFN sandwich -->
  <rect x="252" y="330" width="296" height="186" rx="10" fill="#FBFCFD" stroke="#C9D1DB" filter="url(#sgsoft)"/>
  <rect x="276" y="344" width="248" height="26" rx="6" fill="#F4F6F8" stroke="#D6DBE2"/><text x="400" y="361" font-size="11.5" text-anchor="middle" fill="#5B6470">pre-norm (RMSNorm)</text>
  <!-- two branches -->
  <rect x="276" y="376" width="120" height="92" rx="10" fill="#E4F5EE" stroke="#8ECCB6" filter="url(#sgsoft)"/>
  <text x="336" y="398" font-size="11.5" font-weight="600" text-anchor="middle" fill="#22624F">dense MLP</text>
  <text x="336" y="414" font-size="10" text-anchor="middle" fill="#3E9E7B">shared · GeGLU</text>
  <text x="336" y="428" font-size="10" text-anchor="middle" fill="#3E9E7B">hidden 2112</text>
  <text x="336" y="450" font-size="10" text-anchor="middle" fill="#9CA3AF">every token</text>

  <rect x="404" y="376" width="120" height="92" rx="10" fill="#E4F5EE" stroke="#8ECCB6" filter="url(#sgsoft)"/>
  <text x="464" y="398" font-size="11.5" font-weight="600" text-anchor="middle" fill="#22624F">MoE</text>
  <text x="464" y="414" font-size="10" text-anchor="middle" fill="#3E9E7B">128 experts</text>
  <text x="464" y="428" font-size="10" text-anchor="middle" fill="#3E9E7B">top-8 routed</text>
  <text x="464" y="450" font-size="10" text-anchor="middle" fill="#9CA3AF">8 of 128 fire</text>

  <text x="400" y="486" font-size="13" text-anchor="middle" fill="#6B7280">＋  (summed)</text>
  <rect x="276" y="490" width="248" height="0" /> <!-- spacer -->
  <line x1="276" y1="476" x2="524" y2="476" stroke="#EDEFF2"/>

  <!-- add 2 -->
  <circle cx="110" cy="540" r="13" fill="#FFFFFF" stroke="#8A5BD6" stroke-width="1.6"/><text x="110" y="545" font-size="14" text-anchor="middle" fill="#8A5BD6">+</text>
  <path d="M252,500 L150,500 Q110,500 110,527" fill="none" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#d8)"/>
  <path d="M110,553 L110,572" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#d8)"/>

  <!-- skip scale + out -->
  <rect x="300" y="566" width="200" height="30" rx="10" fill="#E7D6FA" stroke="#9E62D6" filter="url(#sgsoft)"/>
  <text x="400" y="586" font-size="11.5" text-anchor="middle" fill="#56409A">× skip_scale (learned)</text>
  <path d="M110,572 L300,581" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#d8)"/>
  <path d="M400,596 L400,612" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#d8)"/>
  <rect x="300" y="614" width="200" height="30" rx="10" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/>
  <text x="400" y="634" font-size="12.5" text-anchor="middle" fill="#4B5563">output  →  next layer</text>

  <text x="560" y="200" font-size="11" fill="#9CA3AF">sub-layer 1</text>
  <text x="560" y="216" font-size="11" fill="#9CA3AF">(attention)</text>
  <text x="560" y="410" font-size="11" fill="#9CA3AF">sub-layer 2</text>
  <text x="560" y="426" font-size="11" fill="#9CA3AF">(feed-forward)</text>
  <text x="32" y="650" font-size="10" font-style="italic" text-anchor="start" fill="#C0C5CD">×30 layers · 5 local : 1 global</text>
</svg>
