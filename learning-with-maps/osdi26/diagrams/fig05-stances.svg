<svg viewBox="0 0 1060 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,sans-serif" role="img" aria-label="fig05-stances">
<defs><filter id="ds-fig05-stances" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.10"/></filter></defs>
<rect width="1060" height="430" rx="26" fill="#F5F5F7"/>
<rect x="28" y="26" width="622.5" height="40" rx="10" fill="#1D1D1F"/><text x="46" y="52" font-size="17" font-weight="700" fill="#FFFFFF">RL training systems - where each paper stands (S10)</text>
<line x1="130" y1="150" x2="930" y2="150" stroke="#E2E2E7" stroke-width="3"/><text x="130" y="126" font-size="13" font-weight="700" fill="#6E6E73" text-anchor="start">colocated + synchronous</text>
<text x="930" y="126" font-size="13" font-weight="700" fill="#6E6E73" text-anchor="end">disaggregated</text>
<circle cx="162.0" cy="150" r="9" fill="#FF3B30" stroke="#fff" stroke-width="2.5"/><rect x="70" y="190" width="300" height="88" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig05-stances)"/>
<text x="86" y="214" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">Seer</text>
<text x="86" y="234" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">the dissident: stays sync + colocated, wins</text>
<text x="86" y="249" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">back async's gains with group info</text>
<line x1="162.0" y1="160" x2="220" y2="190" stroke="#E2E2E7" stroke-width="1.5"/><circle cx="450.0" cy="150" r="9" fill="#007AFF" stroke="#fff" stroke-width="2.5"/><rect x="250" y="290" width="300" height="88" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig05-stances)"/>
<text x="266" y="314" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">RLinf</text>
<text x="266" y="334" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">compiles logical-&gt;physical; picks the mode</text>
<text x="266" y="349" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">per workload - no universal winner</text>
<line x1="450.0" y1="160" x2="400" y2="290" stroke="#E2E2E7" stroke-width="1.5"/><circle cx="570.0" cy="150" r="9" fill="#007AFF" stroke="#fff" stroke-width="2.5"/><rect x="375" y="190" width="300" height="88" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig05-stances)"/>
<text x="391" y="214" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">DynaRL</text>
<text x="391" y="234" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">reassigns GPUs mid-iteration; migrates</text>
<text x="391" y="249" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">trainers with optimizer state</text>
<line x1="570.0" y1="160" x2="525" y2="190" stroke="#E2E2E7" stroke-width="1.5"/><circle cx="786.0" cy="150" r="9" fill="#FF3B30" stroke="#fff" stroke-width="2.5"/><rect x="555" y="290" width="300" height="88" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig05-stances)"/>
<text x="571" y="314" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">Weave</text>
<text x="571" y="334" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">two GPU pools; phases of different jobs</text>
<text x="571" y="349" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">interleaved cluster-wide</text>
<line x1="786.0" y1="160" x2="705" y2="290" stroke="#E2E2E7" stroke-width="1.5"/><circle cx="898.0" cy="150" r="9" fill="#34C759" stroke="#fff" stroke-width="2.5"/><rect x="680" y="190" width="300" height="88" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig05-stances)"/>
<text x="696" y="214" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">RollArt</text>
<text x="696" y="234" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">sub-phase affinity + bounded-async; 3,000+</text>
<text x="696" y="249" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">GPUs for one week</text>
<line x1="898.0" y1="160" x2="830" y2="190" stroke="#E2E2E7" stroke-width="1.5"/><text x="130" y="400" font-size="12.5" font-weight="400" fill="#86868B" text-anchor="start">5 papers, 3 teams (HKUST/Alibaba x2, Tsinghua+PKU/Infinigence x2, Moonshot/Tsinghua); Mooncake underneath two of them.</text>
</svg>