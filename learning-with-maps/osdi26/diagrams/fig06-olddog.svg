<text x="106" y="160" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">WAN checkpoint pulls</text>
<text x="106" y="182" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start">&gt;60% of tensors &lt;16 KB: RTT-bound; 2.6M GPU-h wasted</text>
<text x="106" y="198" font-size="11.5" font-weight="400" fill="#6E6E73" text-anchor="start"> = half of what eval saves</text>
<line x1="516" y1="180.0" x2="555.0" y2="180.0" stroke="#1D1D1F" stroke-width="2.5"/><polygon points="566,180.0 555.0,185.5 555.0,174.5" fill="#1D1D1F"/>
