<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>LatentMoE data flow</title>
  <desc>A token is routed at full width 8192, squeezed to a 2048-dim latent, processed by 22 of 512 experts there, projected back to 8192, and summed with a full-width shared expert.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
  <defs>
    <filter id="sgsoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation="2.4" flood-color="#1f2937" flood-opacity="0.09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
    <marker id="arrowL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A5BD6"/></marker>
  </defs>

  <rect x="4" y="4" width="952" height="592" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="42" font-size="19" font-weight="700" fill="#111827">Latent<tspan fill="#3E9E7B">MoE</tspan> — route at 8192, <tspan fill="#3E9E7B">compute at 2048</tspan></text>
  <text x="32" y="63" font-size="12" fill="#6B7280">the squeeze makes each expert 4× cheaper — the budget goes into headcount: 512 experts, 22 active, where DeepSeek-V3 runs 256 / 8</text>

  <!-- token in -->
  <rect x="392" y="84" width="176" height="34" rx="9" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/>
  <text x="480" y="106" font-size="12" text-anchor="middle" fill="#4B5563">token · <tspan font-weight="700">8192</tspan></text>

  <!-- router branch (left) -->
  <path d="M392,101 C 290,101 230,120 195,146" stroke="#9CA3AF" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <rect x="48" y="150" width="280" height="130" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="188" y="176" font-size="12.5" font-weight="700" text-anchor="middle" fill="#111827">① router — reads the <tspan fill="#3E9E7B">full 8192</tspan></text>
  <text x="188" y="198" font-size="11" text-anchor="middle" fill="#374151">sigmoid affinities (512) + balance bias</text>
  <text x="188" y="215" font-size="11" text-anchor="middle" fill="#374151">top-22 → normalize → × 5.0</text>
  <text x="188" y="240" font-size="10.5" text-anchor="middle" fill="#6B7280">weight matrix: (512, 8192) — before the</text>
  <text x="188" y="255" font-size="10.5" text-anchor="middle" fill="#6B7280">squeeze, not after · DeepSeek-V3's recipe</text>

  <!-- squeeze -->
  <path d="M480,118 L480,146" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="368" y="150" width="224" height="40" rx="9" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
  <text x="480" y="175" font-size="12" text-anchor="middle" fill="#14503D" font-weight="600">② fc1_latent_proj · 8192 → <tspan font-weight="700">2048</tspan></text>

  <!-- experts card -->
  <path d="M480,190 L480,246" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M328,268 C 340,285 346,295 352,308" stroke="#8A5BD6" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowL)"/>
  <text x="322" y="292" font-size="9.5" fill="#8A5BD6" text-anchor="end">picks who fires</text>
  <rect x="348" y="250" width="380" height="204" rx="12" fill="#FBFCFD" stroke="#4FA98B" stroke-width="1.6" filter="url(#sgsoft)"/>
  <text x="538" y="274" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14503D">③ 512 experts in the latent room — 22 fire</text>

  <rect x="368" y="284" width="340" height="106" rx="6" fill="#F6F8FA" stroke="#E5E7EB"/>
  <!-- cell field: 16 cols × 6 rows, 22 teal -->
  <g stroke-width="0.7">
    <rect x="376" y="291" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="397" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="418" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="439" y="291" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="460" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="481" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="502" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="523" y="291" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="544" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="565" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="586" y="291" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="607" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="628" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="649" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="670" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="691" y="291" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="376" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="397" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="418" y="306" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="439" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="460" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="481" y="306" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="502" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="523" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="544" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="565" y="306" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="586" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="607" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="628" y="306" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="649" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="670" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="691" y="306" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="376" y="321" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="397" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="418" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="439" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="460" y="321" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="481" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="502" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="523" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="544" y="321" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="565" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="586" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="607" y="321" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="628" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="649" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="670" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="691" y="321" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="376" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="397" y="336" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="418" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="439" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="460" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="481" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="502" y="336" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="523" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="544" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="565" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="586" y="336" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="607" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="628" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="649" y="336" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="670" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="691" y="336" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="376" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="397" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="418" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="439" y="351" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="460" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="481" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="502" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="523" y="351" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="544" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="565" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="586" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="607" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="628" y="351" width="17" height="11" rx="2.5" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="649" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="670" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/><rect x="691" y="351" width="17" height="11" rx="2.5" fill="#EEF0F3" stroke="#C9D1DB"/>
