<svg viewBox="0 0 920 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MHA vs GQA vs MQA</title>
  <desc>Three attention variants by how many key-value heads they keep: MHA gives each query head its own KV head (largest cache), GQA shares one KV head across a group of query heads (medium), MQA shares a single KV head across all query heads (smallest). DiffusionGemma's local layers use GQA, 16 query over 8 KV heads.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
  <defs>
    <marker id="a12" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
    <filter id="sgsoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation="2.4" flood-color="#1f2937" flood-opacity="0.09"/></filter>
  </defs>
  <rect x="4" y="4" width="912" height="352" rx="16" fill="#FFFFFF" stroke="#ECEEF1" stroke-width="1.5"/>
  <text x="32" y="40" font-size="19" font-weight="700" fill="#111827"><tspan fill="#9CA3AF">MHA</tspan> → <tspan fill="#3E9E7B">GQA</tspan> → <tspan fill="#9CA3AF">MQA</tspan>: trading KV heads for cache</text>
  <text x="32" y="60" font-size="12" fill="#6B7280">shown with 4 query heads for clarity — DiffusionGemma's local layers are 16 Q / 8 KV</text>

  <!-- three panels -->
  <g font-size="11" text-anchor="middle" fill="#4B5563">
    <!-- Panel 1: MHA -->
    <rect x="36" y="78" width="264" height="244" rx="12" fill="#FBFCFD" stroke="#E7EBF0" filter="url(#sgsoft)"/>
    <text x="168" y="104" font-size="13.5" font-weight="700" fill="#374151">MHA — 4 Q / 4 KV</text>
    <text x="60" y="150" font-size="10.5" fill="#9CA3AF">Q</text>
    <g fill="#A6E1CB" stroke="#3E9E7B"><rect x="94" y="138" width="28" height="22" rx="5"/><rect x="134" y="138" width="28" height="22" rx="5"/><rect x="174" y="138" width="28" height="22" rx="5"/><rect x="214" y="138" width="28" height="22" rx="5"/></g>
    <g stroke="#C7CCD3"><path d="M108,160 L108,210"/><path d="M148,160 L148,210"/><path d="M188,160 L188,210"/><path d="M228,160 L228,210"/></g>
    <text x="60" y="224" font-size="10.5" fill="#9CA3AF">KV</text>
    <g fill="#EEF0F3" stroke="#B6BEC8"><rect x="94" y="210" width="28" height="22" rx="5"/><rect x="134" y="210" width="28" height="22" rx="5"/><rect x="174" y="210" width="28" height="22" rx="5"/><rect x="214" y="210" width="28" height="22" rx="5"/></g>
    <text x="168" y="270" font-size="11.5" font-weight="600" fill="#5B6470">cache: largest</text>
    <text x="168" y="290" font-size="11" fill="#9CA3AF">quality: best</text>

    <!-- Panel 2: GQA -->
    <rect x="328" y="78" width="264" height="244" rx="12" fill="#FBFCFD" stroke="#9FD3C2" stroke-width="1.5" filter="url(#sgsoft)"/>
    <text x="460" y="104" font-size="13.5" font-weight="700" fill="#2F7D67">GQA — 4 Q / 2 KV</text>
    <text x="352" y="150" font-size="10.5" fill="#9CA3AF">Q</text>
    <g fill="#A6E1CB" stroke="#3E9E7B"><rect x="386" y="138" width="28" height="22" rx="5"/><rect x="426" y="138" width="28" height="22" rx="5"/><rect x="466" y="138" width="28" height="22" rx="5"/><rect x="506" y="138" width="28" height="22" rx="5"/></g>
    <g stroke="#C7CCD3"><path d="M400,160 L420,210"/><path d="M440,160 L420,210"/><path d="M480,160 L500,210"/><path d="M520,160 L500,210"/></g>
    <text x="352" y="224" font-size="10.5" fill="#9CA3AF">KV</text>
    <g fill="#EEF0F3" stroke="#B6BEC8"><rect x="404" y="210" width="32" height="22" rx="5"/><rect x="484" y="210" width="32" height="22" rx="5"/></g>
    <text x="460" y="270" font-size="11.5" font-weight="600" fill="#2F7D67">cache: medium · ≈ MHA</text>
    <text x="460" y="290" font-size="11" font-weight="600" fill="#3E9E7B">← DiffusionGemma (16 / 8)</text>

    <!-- Panel 3: MQA -->
    <rect x="620" y="78" width="264" height="244" rx="12" fill="#FBFCFD" stroke="#E7EBF0" filter="url(#sgsoft)"/>
    <text x="752" y="104" font-size="13.5" font-weight="700" fill="#374151">MQA — 4 Q / 1 KV</text>
    <text x="644" y="150" font-size="10.5" fill="#9CA3AF">Q</text>
    <g fill="#A6E1CB" stroke="#3E9E7B"><rect x="678" y="138" width="28" height="22" rx="5"/><rect x="718" y="138" width="28" height="22" rx="5"/><rect x="758" y="138" width="28" height="22" rx="5"/><rect x="798" y="138" width="28" height="22" rx="5"/></g>
    <g stroke="#C7CCD3"><path d="M692,160 L752,210"/><path d="M732,160 L752,210"/><path d="M772,160 L752,210"/><path d="M812,160 L752,210"/></g>
    <text x="644" y="224" font-size="10.5" fill="#9CA3AF">KV</text>
    <rect x="734" y="210" width="36" height="22" rx="5" fill="#EEF0F3" stroke="#B6BEC8"/>
    <text x="752" y="270" font-size="11.5" font-weight="600" fill="#5B6470">cache: smallest</text>
    <text x="752" y="290" font-size="11" fill="#9CA3AF">quality: slight drop</text>
  </g>
  <text x="888" y="344" font-size="10" font-style="italic" text-anchor="end" fill="#C0C5CD">MHA 1706.03762 · MQA 1911.02150 · GQA 2305.13245</text>
</svg>
