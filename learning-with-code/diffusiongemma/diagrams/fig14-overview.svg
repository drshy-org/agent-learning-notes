<svg viewBox="0 0 980 430" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>How DiffusionGemma writes a block</title>
  <desc>DiffusionGemma encodes the prompt once with causal attention into a KV cache, then generates a 256-token block by denoising a canvas of random tokens into clean text over several bidirectional denoising steps with self-conditioning, then commits the finished block to the cache with a causal pass and starts the next block.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
  <defs>
    <filter id="sgsoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation="2.4" flood-color="#1f2937" flood-opacity="0.09"/></filter>
    <marker id="ov" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
    <marker id="ovp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9E62D6"/></marker>
  </defs>
  <rect x="4" y="4" width="972" height="422" rx="16" fill="#FFFFFF" stroke="#ECEEF1" stroke-width="1.5"/>
  <text x="32" y="40" font-size="19" font-weight="700" fill="#111827">How <tspan fill="#3E9E7B">DiffusionGemma</tspan> writes a block</text>
  <text x="32" y="61" font-size="12.5" fill="#6B7280">diffusion within a block · autoregression across blocks</text>

  <!-- Stage 1: Context -->
  <rect x="32" y="86" width="218" height="300" rx="13" fill="#F6F7F9" stroke="#C9D1DB" stroke-width="1.4" filter="url(#sgsoft)"/>
  <text x="141" y="112" font-size="13" font-weight="700" text-anchor="middle" fill="#5B6470">1 · Context</text>
  <text x="141" y="130" font-size="10.5" text-anchor="middle" fill="#9CA3AF">the prompt, encoded once</text>
  <g fill="#EEF0F3" stroke="#B6BEC8"><rect x="66" y="150" width="44" height="26" rx="6"/><rect x="118" y="150" width="44" height="26" rx="6"/><rect x="170" y="150" width="44" height="26" rx="6"/></g>
  <g font-size="10.5" text-anchor="middle" fill="#6B7280"><text x="88" y="167">The</text><text x="140" y="167">LLM</text><text x="192" y="167">picks</text></g>
  <path d="M141,178 L141,196" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ov)"/>
  <rect x="58" y="200" width="166" height="34" rx="9" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/>
  <text x="141" y="222" font-size="11.5" font-weight="600" text-anchor="middle" fill="#4B5563">Encoder · causal</text>
  <path d="M141,236 L141,256" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ov)"/>
  <rect x="78" y="260" width="126" height="32" rx="9" fill="#E9ECF1" stroke="#B6BEC8"/>
  <text x="141" y="281" font-size="11.5" font-weight="600" text-anchor="middle" fill="#5B6470">KV cache</text>
  <text x="141" y="328" font-size="10.5" text-anchor="middle" fill="#9CA3AF">held as left-context</text>
  <text x="141" y="344" font-size="10.5" text-anchor="middle" fill="#9CA3AF">for the canvas</text>

  <path d="M250,234 L290,234" stroke="#9CA3AF" stroke-width="1.7" marker-end="url(#ov)"/>

  <!-- Stage 2: Denoise (the focus) -->
  <rect x="292" y="86" width="396" height="300" rx="13" fill="#FBFCFD" stroke="#3E9E7B" stroke-width="1.8" filter="url(#sgsoft)"/>
  <text x="490" y="112" font-size="13" font-weight="700" text-anchor="middle" fill="#2F7D67">2 · Denoise the canvas</text>
  <text x="490" y="130" font-size="10.5" text-anchor="middle" fill="#9CA3AF">a 256-token block, refined in parallel</text>
  <text x="352" y="158" font-size="10" text-anchor="middle" fill="#9CA3AF">noise</text>
  <g fill="#F5B7AF" stroke="#C75B49"><rect x="320" y="166" width="22" height="22" rx="4"/><rect x="344" y="166" width="22" height="22" rx="4"/><rect x="368" y="166" width="22" height="22" rx="4"/><rect x="320" y="190" width="22" height="22" rx="4"/><rect x="344" y="190" width="22" height="22" rx="4"/><rect x="368" y="190" width="22" height="22" rx="4"/></g>
  <path d="M394,189 L408,189" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ov)"/>
  <rect x="412" y="158" width="156" height="62" rx="10" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
  <text x="490" y="182" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14503D">Denoiser</text>
  <text x="490" y="200" font-size="10" text-anchor="middle" fill="#1F5C49">the transformer,</text>
  <text x="490" y="212" font-size="10" text-anchor="middle" fill="#1F5C49">bidirectional attention</text>
  <path d="M572,189 L586,189" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ov)"/>
  <text x="628" y="158" font-size="10" text-anchor="middle" fill="#9CA3AF">clean</text>
  <g fill="#A6E1CB" stroke="#3E9E7B"><rect x="590" y="166" width="22" height="22" rx="4"/><rect x="614" y="166" width="22" height="22" rx="4"/><rect x="638" y="166" width="22" height="22" rx="4"/><rect x="590" y="190" width="22" height="22" rx="4"/><rect x="614" y="190" width="22" height="22" rx="4"/><rect x="638" y="190" width="22" height="22" rx="4"/></g>
  <text x="490" y="246" font-size="11" font-weight="600" text-anchor="middle" fill="#8A5BD6">repeat × N steps · self-conditioned</text>
  <path d="M600,262 C600,296 380,296 380,264" fill="none" stroke="#9E62D6" stroke-width="1.6" marker-end="url(#ovp)"/>
  <text x="490" y="318" font-size="10.5" text-anchor="middle" fill="#6B7280">each pass: keep the confident tokens,</text>
  <text x="490" y="333" font-size="10.5" text-anchor="middle" fill="#6B7280">re-noise the rest, cool the temperature</text>

  <path d="M688,234 L728,234" stroke="#9CA3AF" stroke-width="1.7" marker-end="url(#ov)"/>

  <!-- Stage 3: Commit & continue -->
  <rect x="730" y="86" width="218" height="300" rx="13" fill="#F6F2FB" stroke="#9E62D6" stroke-width="1.4" filter="url(#sgsoft)"/>
  <text x="839" y="112" font-size="13" font-weight="700" text-anchor="middle" fill="#56409A">3 · Commit &amp; continue</text>
  <text x="839" y="130" font-size="10.5" text-anchor="middle" fill="#9CA3AF">the block becomes context</text>
  <rect x="756" y="152" width="166" height="34" rx="9" fill="#E7D6FA" stroke="#9E62D6" filter="url(#sgsoft)"/>
  <text x="839" y="174" font-size="11" font-weight="600" text-anchor="middle" fill="#56409A">commit · causal pass</text>
  <path d="M839,188 L839,208" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ov)"/>
  <g><rect x="762" y="212" width="42" height="30" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="810" y="212" width="42" height="30" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><rect x="858" y="212" width="42" height="30" rx="6" fill="#EEF0F3" stroke="#B6BEC8" stroke-dasharray="4 3"/></g>
  <g font-size="9.5" text-anchor="middle"><text x="783" y="231" fill="#14503D">blk</text><text x="831" y="231" fill="#14503D">blk</text><text x="879" y="231" fill="#9CA3AF">next</text></g>
  <text x="839" y="276" font-size="10.5" text-anchor="middle" fill="#9CA3AF">blocks laid down left-to-right</text>
  <text x="839" y="322" font-size="10.5" text-anchor="middle" fill="#6B7280">then the next block</text>
  <text x="839" y="337" font-size="10.5" text-anchor="middle" fill="#6B7280">starts from noise again</text>

</svg>
