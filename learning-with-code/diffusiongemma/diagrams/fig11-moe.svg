<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style><defs><filter id='sgsoft' x='-30%' y='-30%' width='160%' height='170%'><feDropShadow dx='0' dy='1.2' stdDeviation='2.4' flood-color='#1f2937' flood-opacity='0.09'/></filter></defs>
  <title>Mixture-of-Experts routing</title>
  <desc>Each token goes through a router that selects its top-8 of 128 experts, plus a shared dense MLP that every token uses. The two branches are summed. 26B total parameters, about 4B active per token.</desc>
  <defs><marker id="m11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
  <rect x="4" y="4" width="772" height="462" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#111827"><tspan fill="#3E9E7B">Mixture-of-Experts</tspan> — 8 of 128 fire (+ a shared expert)</text>
  <text x="32" y="58" font-size="12" fill="#6B7280">a big bank of specialists, but each token pays for only a few → "26B total, ~4B active"</text>

  <rect x="310" y="80" width="160" height="36" rx="10" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/><text x="390" y="103" font-size="12.5" text-anchor="middle" fill="#4B5563">token</text>
  <path d="M390,116 L390,140" fill="none" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#m11)"/>
  <rect x="290" y="142" width="200" height="40" rx="10" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/><text x="390" y="167" font-size="12.5" text-anchor="middle" fill="#374151">Router · softmax → top-8</text>

  <!-- branch lines -->
  <path d="M390,182 C 300,205 250,210 230,224" fill="none" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#m11)"/>
  <path d="M390,182 C 480,205 530,210 550,224" fill="none" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#m11)"/>

  <!-- experts box -->
  <rect x="96" y="226" width="268" height="126" rx="10" fill="#FBFCFD" stroke="#C9D1DB" filter="url(#sgsoft)"/>
  <text x="230" y="248" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2F7D67">Experts — 8 of 128 fire</text>
  <g>
    <!-- row 1 (fired = teal) -->
    <rect x="116" y="262" width="26" height="20" rx="4" fill="#A6E1CB" stroke="#3E9E7B"/>
    <rect x="146" y="262" width="26" height="20" rx="4" fill="#A6E1CB" stroke="#3E9E7B"/>
    <rect x="176" y="262" width="26" height="20" rx="4" fill="#A6E1CB" stroke="#3E9E7B"/>
    <rect x="206" y="262" width="26" height="20" rx="4" fill="#A6E1CB" stroke="#3E9E7B"/>
    <rect x="236" y="262" width="26" height="20" rx="4" fill="#A6E1CB" stroke="#3E9E7B"/>
    <rect x="266" y="262" width="26" height="20" rx="4" fill="#A6E1CB" stroke="#3E9E7B"/>
    <rect x="296" y="262" width="26" height="20" rx="4" fill="#A6E1CB" stroke="#3E9E7B"/>
    <rect x="326" y="262" width="26" height="20" rx="4" fill="#A6E1CB" stroke="#3E9E7B"/>
    <!-- rows 2-3 (idle = gray) -->
    <rect x="116" y="288" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="146" y="288" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="176" y="288" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="206" y="288" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="236" y="288" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="266" y="288" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="296" y="288" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="326" y="288" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="116" y="314" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="146" y="314" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="176" y="314" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="206" y="314" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="236" y="314" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="266" y="314" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="296" y="314" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
    <rect x="326" y="314" width="26" height="20" rx="4" fill="#EEF0F3" stroke="#C9D1DB"/>
  </g>
  <text x="230" y="346" font-size="9.5" text-anchor="middle" fill="#9CA3AF">each expert = a GeGLU (expert_dim 704) · 8 of 128 lit</text>

  <!-- shared box -->
  <rect x="416" y="226" width="268" height="126" rx="10" fill="#E4F5EE" stroke="#8ECCB6" filter="url(#sgsoft)"/>
  <text x="550" y="248" font-size="12.5" font-weight="700" text-anchor="middle" fill="#22624F">Shared dense MLP</text>
  <text x="550" y="284" font-size="12" text-anchor="middle" fill="#3E9E7B">every token, always on</text>
  <text x="550" y="304" font-size="11" text-anchor="middle" fill="#6B7280">(GeGLU, hidden 2112)</text>

  <!-- sum -->
  <path d="M230,352 C 250,372 330,380 374,388" fill="none" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#m11)"/>
  <path d="M550,352 C 530,372 450,380 406,388" fill="none" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#m11)"/>
  <circle cx="390" cy="396" r="15" fill="#FFFFFF" stroke="#374151" stroke-width="1.4"/><text x="390" y="401" font-size="15" text-anchor="middle" fill="#374151">+</text>

  <text x="32" y="448" font-size="11" fill="#6B7280"><tspan font-family="ui-monospace, monospace">num_experts=128 · top_k=8 · expert_dim=704</tspan>  +  shared MLP  →  ≈26B total, ~4B active ("A4B").  <tspan font-style="italic" fill="#C0C5CD">gemma4/_moe.py</tspan></text>
</svg>
