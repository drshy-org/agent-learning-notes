<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>The parallel scan: a chain becomes a tree</title>
  <desc>Left: the sequential recurrence combines eight steps in seven dependent operations. Right: because the combine operator is associative, an up-sweep tree pairs neighbors in log2 T levels; a down-sweep then distributes prefixes. Depth drops from T to log T; each combine is elementwise, so tensor cores stay idle.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
  <defs>
    <filter id="sgsoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation="2.4" flood-color="#1f2937" flood-opacity="0.09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
  </defs>

  <rect x="4" y="4" width="952" height="452" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="42" font-size="19" font-weight="700" fill="#111827">The parallel scan — <tspan fill="#3E9E7B">a chain becomes a tree</tspan></text>
  <text x="32" y="63" font-size="12" fill="#6B7280">the • operator is associative, so bracketing is free: pair neighbors level by level instead of waiting for the step before</text>

  <!-- left: sequential chain -->
  <rect x="32" y="88" width="330" height="316" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.4" filter="url(#sgsoft)"/>
  <text x="197" y="114" font-size="12.5" font-weight="700" text-anchor="middle" fill="#9E3528">chain: 7 dependent steps</text>
  <g font-size="10" text-anchor="middle">
    <rect x="52" y="130" width="36" height="22" rx="6" fill="#F5B7AF" stroke="#C75B49"/><text x="70" y="145" fill="#9E3528">s₁</text>
    <rect x="52" y="162" width="36" height="22" rx="6" fill="#EEF0F3" stroke="#C9D1DB"/><text x="70" y="177" fill="#4B5563">s₂</text>
    <rect x="52" y="194" width="36" height="22" rx="6" fill="#EEF0F3" stroke="#C9D1DB"/><text x="70" y="209" fill="#4B5563">s₃</text>
    <rect x="52" y="226" width="36" height="22" rx="6" fill="#EEF0F3" stroke="#C9D1DB"/><text x="70" y="241" fill="#4B5563">s₄</text>
    <rect x="52" y="258" width="36" height="22" rx="6" fill="#EEF0F3" stroke="#C9D1DB"/><text x="70" y="273" fill="#4B5563">s₅</text>
    <rect x="52" y="290" width="36" height="22" rx="6" fill="#EEF0F3" stroke="#C9D1DB"/><text x="70" y="305" fill="#4B5563">s₆</text>
    <rect x="52" y="322" width="36" height="22" rx="6" fill="#EEF0F3" stroke="#C9D1DB"/><text x="70" y="337" fill="#4B5563">s₇</text>
    <rect x="52" y="354" width="36" height="22" rx="6" fill="#EEF0F3" stroke="#C9D1DB"/><text x="70" y="369" fill="#4B5563">s₈</text>
  </g>
  <g stroke="#C75B49" stroke-width="1.3">
    <path d="M70,152 L70,160" marker-end="url(#arrow)"/><path d="M70,184 L70,192" marker-end="url(#arrow)"/>
    <path d="M70,216 L70,224" marker-end="url(#arrow)"/><path d="M70,248 L70,256" marker-end="url(#arrow)"/>
    <path d="M70,280 L70,288" marker-end="url(#arrow)"/><path d="M70,312 L70,320" marker-end="url(#arrow)"/>
    <path d="M70,344 L70,352" marker-end="url(#arrow)"/>
  </g>
  <text x="120" y="250" font-size="11" fill="#374151">each step waits for the</text>
  <text x="120" y="266" font-size="11" fill="#374151">one before — depth T,</text>
  <text x="120" y="282" font-size="11" fill="#374151">the GPU mostly idles</text>
  <text x="197" y="392" font-size="10.5" text-anchor="middle" fill="#6B7280">what `selective_scan_ref`'s for-loop literally does</text>

  <!-- right: tree (up-sweep) -->
  <rect x="392" y="88" width="536" height="316" rx="12" fill="#FBFCFD" stroke="#8ECCB6" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="660" y="114" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14503D">tree: log₂ 8 = 3 levels, all pairs at once</text>

  <!-- leaves: 8 pairs -->
  <g font-size="9.5" text-anchor="middle">
    <rect x="416" y="134" width="52" height="22" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="442" y="149" fill="#14503D">(a₁,b₁)</text>
    <rect x="478" y="134" width="52" height="22" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="504" y="149" fill="#14503D">(a₂,b₂)</text>
    <rect x="540" y="134" width="52" height="22" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="566" y="149" fill="#14503D">(a₃,b₃)</text>
    <rect x="602" y="134" width="52" height="22" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="628" y="149" fill="#14503D">(a₄,b₄)</text>
    <rect x="664" y="134" width="52" height="22" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="690" y="149" fill="#14503D">(a₅,b₅)</text>
    <rect x="726" y="134" width="52" height="22" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="752" y="149" fill="#14503D">(a₆,b₆)</text>
    <rect x="788" y="134" width="52" height="22" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="814" y="149" fill="#14503D">(a₇,b₇)</text>
    <rect x="850" y="134" width="52" height="22" rx="6" fill="#A6E1CB" stroke="#3E9E7B"/><text x="876" y="149" fill="#14503D">(a₈,b₈)</text>
  </g>
  <!-- level 1: 4 nodes -->
  <g stroke="#9CA3AF" stroke-width="1.2" fill="none">
    <path d="M442,156 L466,196"/><path d="M504,156 L480,196"/>
    <path d="M566,156 L590,196"/><path d="M628,156 L604,196"/>
    <path d="M690,156 L714,196"/><path d="M752,156 L728,196"/>
    <path d="M814,156 L838,196"/><path d="M876,156 L852,196"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <rect x="447" y="200" width="58" height="22" rx="6" fill="#C6EAD9" stroke="#4FA98B"/><text x="476" y="215" fill="#14503D">1•2</text>
    <rect x="571" y="200" width="58" height="22" rx="6" fill="#C6EAD9" stroke="#4FA98B"/><text x="600" y="215" fill="#14503D">3•4</text>
    <rect x="695" y="200" width="58" height="22" rx="6" fill="#C6EAD9" stroke="#4FA98B"/><text x="724" y="215" fill="#14503D">5•6</text>
    <rect x="819" y="200" width="58" height="22" rx="6" fill="#C6EAD9" stroke="#4FA98B"/><text x="848" y="215" fill="#14503D">7•8</text>
  </g>
  <!-- level 2: 2 nodes -->
  <g stroke="#9CA3AF" stroke-width="1.2" fill="none">
    <path d="M476,222 L518,262"/><path d="M600,222 L558,262"/>
    <path d="M724,222 L766,262"/><path d="M848,222 L806,262"/>
  </g>
  <g font-size="10" text-anchor="middle">
    <rect x="504" y="266" width="68" height="22" rx="6" fill="#8ECCB6" stroke="#3E9E7B"/><text x="538" y="281" fill="#14503D">1•…•4</text>
    <rect x="752" y="266" width="68" height="22" rx="6" fill="#8ECCB6" stroke="#3E9E7B"/><text x="786" y="281" fill="#14503D">5•…•8</text>
  </g>
  <!-- level 3: root -->
  <g stroke="#9CA3AF" stroke-width="1.2" fill="none">
    <path d="M538,288 L620,326"/><path d="M786,288 L704,326"/>
  </g>
  <rect x="620" y="330" width="84" height="24" rx="6" fill="#3E9E7B" stroke="#14503D"/>
  <text x="662" y="346" font-size="10.5" text-anchor="middle" fill="#FFFFFF" font-weight="600">1•…•8</text>

  <text x="660" y="378" font-size="10.5" text-anchor="middle" fill="#374151">up-sweep shown; a mirrored down-sweep then hands every prefix h₁…h₈ back down</text>
  <text x="660" y="394" font-size="10.5" text-anchor="middle" fill="#6B7280">depth O(log T), work O(T) — Blelloch's construction, S5's `associative_scan`, Mamba's fused kernel</text>

  <text x="32" y="428" font-size="11.5" fill="#374151">the catch: every • is elementwise multiply-adds — the tensor cores holding most FLOPs sit idle. Mamba-2's SSD fixes exactly this (fig. 11).</text>
  <text x="928" y="446" font-size="10" font-style="italic" text-anchor="end" fill="#C0C5CD">code: S5 s5/ssm.py · binary_operator + jax.lax.associative_scan · mamba csrc/selective_scan_fwd_kernel.cuh</text>
</svg>
