  <text x="538" y="412" font-size="10.5" text-anchor="middle" fill="#6B7280">each expert: 2048 → 5120 → 2048, ReLU² — no gate <tspan fill="#9CA3AF">(96 of 512 shown)</tspan></text>
  <text x="538" y="432" font-size="10.5" text-anchor="middle" fill="#3E9E7B" font-weight="600">4× smaller weights per expert — the savings buy headcount</text>

  <!-- shared expert (right) -->
  <path d="M568,101 C 690,101 760,120 810,146" stroke="#9CA3AF" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <rect x="756" y="150" width="176" height="270" rx="12" fill="#E4F5EE" stroke="#8ECCB6" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="844" y="176" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14503D">⑤ shared expert</text>
  <text x="844" y="198" font-size="11" text-anchor="middle" fill="#22624F">always on, every token</text>
  <text x="844" y="224" font-size="11" text-anchor="middle" fill="#374151">full width:</text>
  <text x="844" y="242" font-size="11.5" text-anchor="middle" fill="#14503D" font-weight="600">8192 → 10240 → 8192</text>
  <text x="844" y="266" font-size="10.5" text-anchor="middle" fill="#6B7280">ReLU², two matrices</text>
  <text x="844" y="332" font-size="10.5" text-anchor="middle" fill="#22624F">common knowledge stays wide,</text>
  <text x="844" y="348" font-size="10.5" text-anchor="middle" fill="#22624F">specialists go narrow</text>
  <text x="844" y="364" font-size="10.5" text-anchor="middle" fill="#22624F">and numerous</text>

  <!-- unsqueeze -->
  <path d="M480,454 L480,478" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="368" y="482" width="224" height="40" rx="9" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
  <text x="480" y="507" font-size="12" text-anchor="middle" fill="#14503D" font-weight="600">④ fc2_latent_proj · 2048 → <tspan font-weight="700">8192</tspan></text>

  <!-- sum -->
  <path d="M480,522 L480,534" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="480" cy="551" r="14" fill="#FFFFFF" stroke="#374151" stroke-width="1.4"/><text x="480" y="556" font-size="14" text-anchor="middle" fill="#374151">+</text>
  <path d="M844,420 L844,578 L497,578 L484,566" stroke="#9CA3AF" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M498,551 L556,551" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="560" y="534" width="140" height="34" rx="9" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/>
  <text x="630" y="556" font-size="12" text-anchor="middle" fill="#4B5563">out · 8192</text>

  <text x="932" y="590" font-size="10" font-style="italic" text-anchor="end" fill="#C0C5CD">source: modeling_nemotron_h.py · NemotronHMoE / NemotronHTopkRouter / NemotronHExperts</text>
