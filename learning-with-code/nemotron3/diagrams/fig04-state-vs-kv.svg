<svg viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Constant state vs growing KV cache</title>
  <desc>Left: a Mamba-2 state stays the same size at 1k, 100k and 1M tokens of context. Right: an all-attention model's KV cache grows linearly; Ultra keeps KV in only 12 of 108 layers.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
  <defs>
    <filter id="sgsoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation="2.4" flood-color="#1f2937" flood-opacity="0.09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
  </defs>

  <rect x="4" y="4" width="952" height="392" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="42" font-size="19" font-weight="700" fill="#111827">What "context" costs: <tspan fill="#3E9E7B">a summary that never grows</tspan> vs <tspan fill="#C75B49">a transcript that always does</tspan></text>
  <text x="32" y="63" font-size="12" fill="#6B7280">the agent lens: a model that re-enters its context thousands of times pays this bill on every single step</text>

  <!-- left card: mamba state -->
  <rect x="32" y="86" width="430" height="250" rx="12" fill="#FBFCFD" stroke="#8ECCB6" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="247" y="114" font-size="13.5" font-weight="700" text-anchor="middle" fill="#14503D">Mamba-2 state — 48 of Ultra's blocks</text>

  <g text-anchor="middle">
    <rect x="72" y="150" width="90" height="90" rx="10" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
    <text x="117" y="200" font-size="11.5" fill="#14503D" font-weight="600">8 MiB</text>
    <text x="117" y="262" font-size="11" fill="#6B7280">1k tokens</text>

    <rect x="202" y="150" width="90" height="90" rx="10" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
    <text x="247" y="200" font-size="11.5" fill="#14503D" font-weight="600">8 MiB</text>
    <text x="247" y="262" font-size="11" fill="#6B7280">100k tokens</text>

    <rect x="332" y="150" width="90" height="90" rx="10" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
    <text x="377" y="200" font-size="11.5" fill="#14503D" font-weight="600">8 MiB</text>
    <text x="377" y="262" font-size="11" fill="#6B7280">1M tokens</text>
  </g>
  <text x="247" y="304" font-size="12" text-anchor="middle" fill="#14503D" font-weight="600">per-layer state: 256 × (64 × 128), fp32 — same at any depth</text>
  <text x="247" y="322" font-size="10.5" text-anchor="middle" fill="#6B7280">decode step = one read, one multiply-add, one write · O(1)</text>

  <!-- right card: kv growth -->
  <rect x="498" y="86" width="430" height="250" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="713" y="114" font-size="13.5" font-weight="700" text-anchor="middle" fill="#111827">KV cache — grows with every token</text>

  <!-- bars: full-attention ghost (coral) vs 12-layer (lavender) -->
  <g>
    <!-- 1k -->
    <rect x="548" y="266" width="44" height="6" rx="2" fill="#F5B7AF" stroke="#C75B49" stroke-width="0.8"/>
    <rect x="598" y="271" width="44" height="1.6" rx="0.8" fill="#E7D6FA" stroke="#9E62D6" stroke-width="0.6"/>
    <text x="595" y="290" font-size="11" text-anchor="middle" fill="#6B7280">1k</text>
    <!-- 100k -->
    <rect x="668" y="212" width="44" height="60" rx="2" fill="#F5B7AF" stroke="#C75B49" stroke-width="0.8"/>
    <rect x="718" y="265" width="44" height="7" rx="2" fill="#E7D6FA" stroke="#9E62D6" stroke-width="0.8"/>
    <text x="715" y="290" font-size="11" text-anchor="middle" fill="#6B7280">100k</text>
    <!-- 1M -->
    <rect x="788" y="152" width="44" height="120" rx="2" fill="#F5B7AF" stroke="#C75B49" stroke-width="0.8"/>
    <rect x="838" y="258" width="44" height="14" rx="2" fill="#E7D6FA" stroke="#9E62D6" stroke-width="0.8"/>
    <text x="835" y="290" font-size="11" text-anchor="middle" fill="#6B7280">1M tokens</text>
  </g>
  <text x="810" y="143" font-size="10.5" text-anchor="middle" fill="#9E3528">~54 GiB if all 108 layers cached KV</text>
  <text x="860" y="247" font-size="10.5" text-anchor="middle" fill="#56409A">~6 GiB</text>
  <text x="713" y="311" font-size="12" text-anchor="middle" fill="#374151"><tspan fill="#C75B49" font-weight="600">hypothetical full-attention Ultra</tspan> vs <tspan fill="#9E62D6" font-weight="600">the real 12 layers</tspan> (FP8)</text>
  <text x="713" y="326" font-size="10.5" text-anchor="middle" fill="#6B7280">…and every decoded token must re-read what's cached · O(T)</text>

  <text x="32" y="372" font-size="12" fill="#374151">the trade: attention keeps every token <tspan font-weight="600">addressable</tspan>; Mamba keeps a lossy summary. Ultra buys back exact recall at 12 anchor points (§4).</text>
  <text x="928" y="388" font-size="10" font-style="italic" text-anchor="end" fill="#C0C5CD">sizes from config.json: 12 layers × 2 heads × 2 (K,V) × 128 · state 256 × 64 × 128</text>
</svg>
