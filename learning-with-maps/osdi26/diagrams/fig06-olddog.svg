<rect x="590" y="364" width="194.8" height="22" rx="11" fill="#007AFF"/><text x="687.4" y="379" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">pushdown to storage CPUs</text>
<text x="590" y="406" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">storage cores at 20-30% util. do the decode</text>
<text x="80" y="476" font-size="13.5" font-weight="700" fill="#34C759" text-anchor="start">eval waste per regression: 16,800 -&gt; 4,000 GPU-hours; startup loads -40.8%; transform stalls -63.2% - and HDFS stays.</text>
