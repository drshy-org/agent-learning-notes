<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>The MTP draft-and-verify loop</title>
  <desc>A two-block MTP drafter proposes six tokens recursively; the 108-block backbone verifies them in one pass, accepting the matching prefix. The Mamba SSM state is snapshotted at each draft step so rejected tokens can be rolled back.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
  <defs>
    <filter id="sgsoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation="2.4" flood-color="#1f2937" flood-opacity="0.09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E9E7B"/></marker>
  </defs>

  <rect x="4" y="4" width="952" height="462" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="42" font-size="19" font-weight="700" fill="#111827">Draft with <tspan fill="#3E9E7B">2 blocks</tspan>, verify with 108 — <tspan fill="#6B7280">one head, applied recursively</tspan></text>
  <text x="32" y="63" font-size="12" fill="#6B7280">the same shared-weight head re-applies to its own output, so the draft horizon is a serving knob, not an architecture constant</text>

  <!-- backbone card -->
  <rect x="32" y="90" width="240" height="130" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="152" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">backbone · 108 blocks</text>
  <text x="152" y="138" font-size="11" text-anchor="middle" fill="#374151">emits token t and hidden state h_t</text>
  <rect x="70" y="152" width="164" height="26" rx="7" fill="#EEF0F3" stroke="#B6BEC8"/>
  <text x="152" y="169" font-size="10.5" text-anchor="middle" fill="#4B5563">h_t · 8192   +   token t</text>
  <text x="152" y="203" font-size="10" text-anchor="middle" fill="#9CA3AF">55B active parameters per pass</text>

  <!-- drafter card -->
  <path d="M272,155 L312,155" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="316" y="90" width="280" height="130" rx="12" fill="#E4F5EE" stroke="#4FA98B" stroke-width="1.6" filter="url(#sgsoft)"/>
  <text x="456" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#14503D">MTP drafter · 2 blocks</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="336" y="128" width="240" height="24" rx="6" fill="#FBFCFD" stroke="#C9D1DB"/>
    <text x="456" y="144" fill="#374151">concat(norm(emb), norm(h)) → eh_proj</text>
    <rect x="336" y="158" width="116" height="24" rx="6" fill="#E7D6FA" stroke="#9E62D6"/>
    <text x="394" y="174" fill="#56409A">attention</text>
    <rect x="460" y="158" width="116" height="24" rx="6" fill="#EEF0F3" stroke="#B6BEC8"/>
    <text x="518" y="174" fill="#4B5563">MoE</text>
  </g>
  <text x="456" y="203" font-size="10" text-anchor="middle" fill="#22624F">shares embeddings + lm_head with the backbone</text>

  <!-- recursive loop arrow -->
  <path d="M596,140 C 640,140 640,180 596,182" stroke="#3E9E7B" stroke-width="1.5" fill="none" marker-end="url(#arrowT)"/>
  <text x="652" y="164" font-size="10.5" fill="#3E9E7B" font-weight="600">re-apply to its</text>
  <text x="652" y="178" font-size="10.5" fill="#3E9E7B" font-weight="600">own guess</text>

  <!-- draft chain -->
  <text x="60" y="266" font-size="12" font-weight="700" fill="#111827">① draft — six cheap guesses in a row</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="60" y="278" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="96" y="297" fill="#14503D">d₁</text>
    <rect x="148" y="278" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="184" y="297" fill="#14503D">d₂</text>
    <rect x="236" y="278" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="272" y="297" fill="#14503D">d₃</text>
    <rect x="324" y="278" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="360" y="297" fill="#14503D">d₄</text>
    <rect x="412" y="278" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="448" y="297" fill="#14503D">d₅</text>
    <rect x="500" y="278" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="536" y="297" fill="#14503D">d₆</text>
  </g>
  <path d="M132,293 L144,293" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M220,293 L232,293" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M308,293 L320,293" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M396,293 L408,293" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M484,293 L496,293" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- snapshot note -->
  <rect x="616" y="258" width="312" height="66" rx="10" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.3" filter="url(#sgsoft)"/>
  <text x="772" y="280" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111827">the hybrid catch: SSM state can't truncate</text>
  <text x="772" y="299" font-size="10.5" text-anchor="middle" fill="#374151">KV rolls back by deleting entries; a Mamba state is</text>
  <text x="772" y="314" font-size="10.5" text-anchor="middle" fill="#374151">overwritten — so it's <tspan font-weight="600" fill="#14503D">snapshotted at every draft step</tspan></text>

  <!-- verify row -->
  <text x="60" y="360" font-size="12" font-weight="700" fill="#111827">② verify — one backbone pass over all six</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="60" y="372" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="96" y="391" fill="#14503D">d₁ ✓</text>
    <rect x="148" y="372" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="184" y="391" fill="#14503D">d₂ ✓</text>
    <rect x="236" y="372" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="272" y="391" fill="#14503D">d₃ ✓</text>
    <rect x="324" y="372" width="72" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="360" y="391" fill="#14503D">d₄ ✓</text>
    <rect x="412" y="372" width="72" height="30" rx="8" fill="#F5B7AF" stroke="#C75B49"/><text x="448" y="391" fill="#9E3528">d₅ ✗</text>
    <rect x="500" y="372" width="72" height="30" rx="8" fill="#EEF0F3" stroke="#B6BEC8" stroke-dasharray="4 3"/><text x="536" y="391" fill="#9CA3AF">d₆</text>
  </g>
  <text x="60" y="428" font-size="11" fill="#374151">accept the matching prefix (+1 free token from the verify pass), restore the snapshot at the miss, go again</text>

  <!-- numbers strip -->
  <text x="616" y="360" font-size="12" font-weight="700" fill="#111827">what it's worth</text>
  <g font-size="11" fill="#374151">
    <text x="616" y="382">avg. acceptance @ draft 7</text><text x="928" y="382" text-anchor="end" font-weight="700" fill="#14503D">≈ 4.6 tokens</text>
    <text x="616" y="403">single-user decode, draft 6</text><text x="928" y="403" text-anchor="end" font-weight="700" fill="#14503D">2.89× faster</text>
    <text x="616" y="424">RL rollout generation, draft 5</text><text x="928" y="424" text-anchor="end" font-weight="700" fill="#14503D">1.46× faster</text>
  </g>

  <text x="928" y="452" font-size="10" font-style="italic" text-anchor="end" fill="#C0C5CD">source: vllm · models/nemotron_h_mtp.py · numbers: Ultra tech report §3.4, §3.6, Fig 16</text>
</svg>
