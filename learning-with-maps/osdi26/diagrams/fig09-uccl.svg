<svg viewBox="0 0 1060 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,sans-serif" role="img" aria-label="fig09-uccl">
<defs><filter id="ds-fig09-uccl" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.10"/></filter></defs>
<rect width="1060" height="480" rx="26" fill="#F5F5F7"/>
<rect x="28" y="26" width="795.0" height="40" rx="10" fill="#1D1D1F"/><text x="46" y="52" font-size="17" font-weight="700" fill="#FFFFFF">One project, two layers - the software network stack returns (S13)</text>
<rect x="90" y="100" width="620" height="108" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig09-uccl)"/>
<circle cx="90" cy="100" r="14" fill="#007AFF" stroke="#FFFFFF" stroke-width="2.5"/><text x="90" y="104.5" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">EP</text>
<text x="116" y="128" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">UEP - expert-parallel layer (the DeepEP seat)</text>
<text x="116" y="152" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">GPU only ISSUES: 128-bit commands into a lock-free FIFO;</text>
<text x="116" y="170" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">CPU proxy EXECUTES via libibverbs; ordering emulated in software</text>
<text x="116" y="192" font-size="12.5" font-weight="600" fill="#34C759" text-anchor="start">O(m x n) -&gt; O(m) ports; AMD+EFA in 3 person-months; 2.1x on EFA</text>
<rect x="90" y="236" width="620" height="108" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig09-uccl)"/>
<circle cx="90" cy="236" r="14" fill="#007AFF" stroke="#FFFFFF" stroke-width="2.5"/><text x="90" y="240.5" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">TR</text>
<text x="116" y="264" font-size="14.5" font-weight="800" fill="#1D1D1F" text-anchor="start">UCCL-Tran - transport layer (under NCCL/RCCL)</text>
<text x="116" y="288" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">seq/ack, SACK, CUBIC, receiver credits - TCP's lexicon in host software;</text>
<text x="116" y="306" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">NIC demoted to dumb data plane; 256-path packet spraying</text>
<text x="116" y="328" font-size="12.5" font-weight="600" fill="#34C759" text-anchor="start">one CPU core drives 400 Gbps; collectives up to 4.5x</text>
<rect x="750" y="100" width="240" height="244" rx="14" fill="#F2F2F5" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig09-uccl)"/>
<text x="770" y="128" font-size="14" font-weight="800" fill="#1D1D1F" text-anchor="start">same project</text>
<text x="770" y="152" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">7 shared authors</text>
<text x="770" y="172" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">one repo (UEP lives in</text>
<text x="770" y="190" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">uccl/ep/)</text>
<text x="770" y="216" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">same argument:</text>
<text x="770" y="236" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">cluster CPU utilization</text>
<text x="770" y="254" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">is only 14.5-45% - move</text>
<text x="770" y="272" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">the control plane back</text>
<text x="770" y="290" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">to software</text>
<rect x="770" y="310" width="170" height="22" rx="11" fill="#007AFF"/><text x="855.0" y="325" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">the syscall is back</text>
<text x="90" y="396" font-size="12.5" font-weight="400" fill="#86868B" text-anchor="start">old words: syscall / delegation (UEP), transport layer (UCCL-Tran), coroutine (BatchGen), swapping + SLO (Local-MoE)</text>
<text x="90" y="420" font-size="13" font-weight="600" fill="#1D1D1F" text-anchor="start">the pendulum: a decade of hardware offload swings back the moment the workload evolves faster than silicon</text>
</svg>