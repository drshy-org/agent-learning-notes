<rect x="590" y="148" width="180.4" height="22" rx="11" fill="#007AFF"/><text x="680.2" y="163" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">predictive replication</text>
<text x="590" y="190" font-size="12.5" font-weight="400" fill="#6E6E73" text-anchor="start">shards copied before the eval reads them</text>
<rect x="80" y="240" width="430" height="96" rx="14" fill="#FFF3E3" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig06-olddog)"/>
