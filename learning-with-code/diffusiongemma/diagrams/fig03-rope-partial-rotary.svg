<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style><defs><filter id='sgsoft' x='-30%' y='-30%' width='160%' height='170%'><feDropShadow dx='0' dy='1.2' stdDeviation='2.4' flood-color='#1f2937' flood-opacity='0.09'/></filter></defs>
  <title>RoPE partial rotary by layer type</title>
  <desc>Local sliding layers rotate the full head dimension with base frequency 10,000. Global layers rotate only 25% of the head dimension (base frequency 1,000,000) and leave the rest position-agnostic, implemented by padding the timescale with infinity.</desc>

  <rect x="4" y="4" width="892" height="422" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="40" font-size="19" font-weight="700" fill="#111827"><tspan fill="#3E9E7B">RoPE</tspan>: partial rotary, set per layer type</text>
  <text x="32" y="60" font-size="12" fill="#6B7280">Rotate q,k by an angle ∝ position → the q·k score depends only on relative distance (m − n).</text>

  <!-- local -->
  <text x="32" y="104" font-size="13.5" font-weight="700" fill="#374151">Local (sliding) layers · rope_proportion = 1.0</text>
  <rect x="32" y="116" width="660" height="34" rx="10" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
  <text x="362" y="138" font-size="12" text-anchor="middle" fill="#14503D" font-weight="600">all head dims rotated</text>
  <text x="708" y="138" font-size="11.5" fill="#3E9E7B">base θ = 10,000</text>

  <!-- global -->
  <text x="32" y="196" font-size="13.5" font-weight="700" fill="#374151">Global layers · rope_proportion = 0.25</text>
  <rect x="32" y="208" width="165" height="34" rx="10" fill="#A6E1CB" stroke="#3E9E7B" filter="url(#sgsoft)"/>
  <text x="114" y="230" font-size="11.5" text-anchor="middle" fill="#14503D" font-weight="600">25% rotated</text>
  <rect x="197" y="208" width="495" height="34" rx="10" fill="#EEF0F3" stroke="#B6BEC8" filter="url(#sgsoft)"/>
  <text x="444" y="230" font-size="11.5" text-anchor="middle" fill="#6B7280">75% position-agnostic (NoPE) — timescale padded with ∞ ⇒ no rotation</text>
  <text x="708" y="230" font-size="11.5" fill="#3E9E7B">base θ = 1,000,000</text>

  <text x="32" y="262" font-size="11.5" fill="#9CA3AF">← head dimension (0 … head_dim) →</text>

  <!-- rotation inset -->
  <line x1="32" y1="292" x2="868" y2="292" stroke="#EDEFF2"/>
  <g transform="translate(120,360)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="#E5E7EB"/>
    <line x1="0" y1="0" x2="44" y2="0" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="0" y1="0" x2="31" y2="-31" stroke="#3E9E7B" stroke-width="2.5"/>
    <path d="M40,0 A40,40 0 0 0 28,-28" fill="none" stroke="#4FA98B" stroke-width="1.5"/>
    <text x="20" y="-40" font-size="11" fill="#3E9E7B">θ ∝ position</text>
  </g>
  <text x="210" y="345" font-size="12" fill="#4B5563" font-weight="600">Why two settings?</text>
  <text x="210" y="364" font-size="11.5" fill="#6B7280">Local layers need exact nearby order → full rotary, short wavelength (θ=10k).</text>
  <text x="210" y="382" font-size="11.5" fill="#6B7280">Global layers reach across the whole context → mostly content, long wavelength (θ=1M),</text>
  <text x="210" y="400" font-size="11.5" fill="#6B7280">so only a quarter of each (wider, 512-dim) head is rotated.</text>

  <text x="32" y="418" font-size="10" font-style="italic" fill="#C0C5CD">gemma/gm/math/_positional_embeddings.py · apply_rope</text>
</svg>
