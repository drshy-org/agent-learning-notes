<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>What Nemotron 3 Ultra is made of</title>
  <desc>Overview map: a 108-block stack of Mamba-2, LatentMoE and attention blocks, with an MTP draft head riding on the backbone. 550B total, 55B active parameters.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
  <defs>
    <filter id="sgsoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation="2.4" flood-color="#1f2937" flood-opacity="0.09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
  </defs>

  <rect x="4" y="4" width="952" height="552" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#111827">Nemotron 3 Ultra — <tspan fill="#3E9E7B">550B total, 55B active</tspan>, shaped for the serving bill</text>
  <text x="32" y="63" font-size="12.5" fill="#6B7280">108 blocks, one mixer each · attention survives in 12 · every FFN slot is a LatentMoE · a draft head rides in the checkpoint</text>

  <!-- ══ left: the stack ══ -->
  <rect x="32" y="88" width="250" height="380" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="157" y="114" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">the backbone rhythm</text>
  <text x="157" y="131" font-size="10.5" text-anchor="middle" fill="#6B7280">…repeated to 108 blocks</text>

  <!-- rhythm unit: M E M E M A E -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="82" y="146" width="150" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="157" y="165" fill="#14503D" font-weight="600">Mamba-2</text>
    <rect x="82" y="184" width="150" height="30" rx="8" fill="#EEF0F3" stroke="#B6BEC8"/><text x="157" y="203" fill="#4B5563">Latent MoE</text>
    <rect x="82" y="222" width="150" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="157" y="241" fill="#14503D" font-weight="600">Mamba-2</text>
    <rect x="82" y="260" width="150" height="30" rx="8" fill="#EEF0F3" stroke="#B6BEC8"/><text x="157" y="279" fill="#4B5563">Latent MoE</text>
    <rect x="82" y="298" width="150" height="30" rx="8" fill="#A6E1CB" stroke="#3E9E7B"/><text x="157" y="317" fill="#14503D" font-weight="600">Mamba-2</text>
    <rect x="82" y="336" width="150" height="30" rx="8" fill="#E7D6FA" stroke="#9E62D6"/><text x="157" y="355" fill="#56409A" font-weight="600">Attention</text>
    <rect x="82" y="374" width="150" height="30" rx="8" fill="#EEF0F3" stroke="#B6BEC8"/><text x="157" y="393" fill="#4B5563">Latent MoE</text>
  </g>
  <text x="157" y="428" font-size="10.5" text-anchor="middle" fill="#6B7280">sequence-mix, channel-mix, repeat —</text>
  <text x="157" y="443" font-size="10.5" text-anchor="middle" fill="#6B7280">an attention block splices in ~every 9 blocks</text>

  <!-- ══ middle: three component cards ══ -->
  <rect x="312" y="88" width="380" height="118" rx="12" fill="#E4F5EE" stroke="#8ECCB6" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="330" y="114" font-size="13.5" font-weight="700" fill="#14503D">Mamba-2 × 48 <tspan font-weight="400" fill="#22624F">— the workhorse</tspan></text>
  <text x="330" y="136" font-size="11.5" fill="#22624F">carries a fixed-size state: 256 heads × (64 × 128)</text>
  <text x="330" y="153" font-size="11.5" fill="#22624F">decode cost per token: constant in context length</text>
  <text x="330" y="175" font-size="11" fill="#3E9E7B" font-weight="600">§3 · h ← h · e^(Δa) + (Δx)Bᵀ</text>
  <text x="330" y="195" font-size="10" fill="#6B7280">no KV, no growth — 8 MiB of state per layer, always</text>

  <rect x="312" y="218" width="380" height="118" rx="12" fill="#F3EBFC" stroke="#C5A6EA" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="330" y="244" font-size="13.5" font-weight="700" fill="#56409A">Attention × 12 <tspan font-weight="400" fill="#6B7280">— sparse global anchors</tspan></text>
  <text x="330" y="266" font-size="11.5" fill="#56409A">GQA, 64 query heads : 2 KV heads (d_head 128)</text>
  <text x="330" y="283" font-size="11.5" fill="#56409A">no positional encoding — order comes from the recurrence</text>
  <text x="330" y="305" font-size="11" fill="#9E62D6" font-weight="600">§4 · the only place token 900,000 can fetch token 17</text>
  <text x="330" y="325" font-size="10" fill="#6B7280">KV cache: 12 layers instead of 108 → 9× smaller</text>

  <rect x="312" y="348" width="380" height="120" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="330" y="374" font-size="13.5" font-weight="700" fill="#111827">Latent<tspan fill="#3E9E7B">MoE</tspan> × 48 <tspan font-weight="400" fill="#6B7280">— every FFN slot</tspan></text>
  <text x="330" y="396" font-size="11.5" fill="#374151">route at width 8192 → compute at width 2048</text>
  <text x="330" y="413" font-size="11.5" fill="#374151">512 experts, top-22 fire, + 1 always-on shared expert</text>
  <text x="330" y="435" font-size="11" fill="#3E9E7B" font-weight="600">§5 · 4× cheaper experts → 4× more of them</text>
  <text x="330" y="455" font-size="10" fill="#6B7280">experts are 2-matrix ReLU² MLPs, not SwiGLU</text>

  <!-- ══ right: MTP + numbers ══ -->
  <rect x="722" y="88" width="206" height="188" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="825" y="114" font-size="13.5" font-weight="700" text-anchor="middle" fill="#111827">the <tspan fill="#3E9E7B">drafter</tspan> inside</text>
  <text x="825" y="134" font-size="10.5" text-anchor="middle" fill="#6B7280">1,040 mtp.* tensors in the checkpoint</text>
  <rect x="748" y="148" width="154" height="26" rx="7" fill="#E7D6FA" stroke="#9E62D6"/><text x="825" y="165" font-size="10.5" text-anchor="middle" fill="#56409A">1 attention block</text>
  <rect x="748" y="180" width="154" height="26" rx="7" fill="#EEF0F3" stroke="#B6BEC8"/><text x="825" y="197" font-size="10.5" text-anchor="middle" fill="#4B5563">1 MoE block</text>
  <text x="825" y="228" font-size="10.5" text-anchor="middle" fill="#374151">proposes ~6 tokens per step;</text>
  <text x="825" y="243" font-size="10.5" text-anchor="middle" fill="#374151">the 108-block backbone verifies</text>
  <text x="825" y="263" font-size="10.5" text-anchor="middle" fill="#3E9E7B" font-weight="600">§6 · 2.89× decode throughput</text>

  <rect x="722" y="288" width="206" height="180" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="825" y="314" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">what it buys</text>
  <g font-size="11" fill="#374151">
    <text x="740" y="340">decode vs GLM-5.1</text><text x="910" y="340" text-anchor="end" font-weight="700" fill="#14503D">5.9×</text>
    <text x="740" y="363">KV @ 1M ctx (FP8)</text><text x="910" y="363" text-anchor="end" font-weight="700" fill="#14503D">~6 GiB</text>
    <text x="740" y="386">RULER @ 1M</text><text x="910" y="386" text-anchor="end" font-weight="700" fill="#14503D">94.7</text>
    <text x="740" y="409">NVFP4 checkpoint</text><text x="910" y="409" text-anchor="end" font-weight="700" fill="#14503D">~330 GiB</text>
    <text x="740" y="432">pre-training</text><text x="910" y="432" text-anchor="end" font-weight="700" fill="#14503D">20T tok, FP4</text>
  </g>
  <text x="825" y="458" font-size="9.5" text-anchor="middle" fill="#9CA3AF">tech report, Figs 1/15/16, Tables 1/18</text>

  <!-- flow arrows -->
  <path d="M282,278 L308,278" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M692,278 L718,278" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="32" y="530" font-size="11" fill="#6B7280">one file serves the whole family — Nano 30B, Super 120B and Ultra 550B all instantiate <tspan font-weight="600" fill="#374151">NemotronHForCausalLM</tspan></text>
  <text x="928" y="544" font-size="10" font-style="italic" text-anchor="end" fill="#C0C5CD">source: transformers · models/nemotron_h/modeling_nemotron_h.py + vllm · models/nemotron_h_mtp.py</text>
</svg>
