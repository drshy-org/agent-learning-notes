<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>One SSM, three faces</title>
  <desc>The same state-space model has a continuous ODE form, a recurrent form obtained by zero-order-hold discretization, and a convolutional form obtained by unrolling — the last one only exists under linear time-invariance. Mamba-2's SSD is a fourth face: a masked matmul that parallelizes training without LTI.</desc>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style>
  <defs>
    <filter id="sgsoft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation="2.4" flood-color="#1f2937" flood-opacity="0.09"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E9E7B"/></marker>
  </defs>

  <rect x="4" y="4" width="952" height="492" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="42" font-size="19" font-weight="700" fill="#111827">One SSM, <tspan fill="#3E9E7B">three faces</tspan> — and Mamba-2's fourth</text>
  <text x="32" y="63" font-size="12" fill="#6B7280">the same layer, four ways to compute it; which faces exist depends on what you demand of the dynamics</text>

  <!-- top: continuous -->
  <rect x="330" y="88" width="300" height="72" rx="12" fill="#EEF0F3" stroke="#B6BEC8" stroke-width="1.4" filter="url(#sgsoft)"/>
  <text x="480" y="114" font-size="12.5" font-weight="700" text-anchor="middle" fill="#4B5563">continuous — the definition</text>
  <text x="480" y="136" font-size="12" text-anchor="middle" fill="#374151">h′(t) = A·h(t) + B·x(t)</text>
  <text x="480" y="152" font-size="10" text-anchor="middle" fill="#9CA3AF">where Δ gets its meaning: time</text>

  <!-- ZOH arrow down-left -->
  <path d="M352,160 C 300,190 260,210 232,238" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="196" y="180" width="128" height="16" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <text x="260" y="192" font-size="9.5" text-anchor="middle" fill="#6B7280">integrate one step (ZOH)</text>

  <!-- left: recurrent -->
  <rect x="60" y="242" width="330" height="120" rx="12" fill="#E4F5EE" stroke="#4FA98B" stroke-width="1.6" filter="url(#sgsoft)"/>
  <text x="225" y="268" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14503D">recurrent — h ← Ā·h + B̄·x</text>
  <text x="225" y="288" font-size="11" text-anchor="middle" fill="#22624F">O(1) per token, state never grows</text>
  <text x="225" y="306" font-size="11" text-anchor="middle" fill="#22624F">train-time: associative → Blelloch parallel scan,</text>
  <text x="225" y="322" font-size="11" text-anchor="middle" fill="#22624F">O(log T) depth — but elementwise, no tensor cores</text>
  <text x="225" y="344" font-size="10.5" text-anchor="middle" fill="#3E9E7B" font-weight="600">decode face for every SSM · Mamba-1's train face too</text>

  <!-- unroll arrow to conv -->
  <path d="M608,160 C 660,190 700,210 728,238" stroke="#9CA3AF" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="642" y="180" width="150" height="16" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <text x="717" y="192" font-size="9.5" text-anchor="middle" fill="#6B7280">unroll — IF dynamics never change</text>

  <!-- right: convolutional -->
  <rect x="570" y="242" width="330" height="120" rx="12" fill="#FBFCFD" stroke="#C9D1DB" stroke-width="1.5" filter="url(#sgsoft)"/>
  <text x="735" y="268" font-size="12.5" font-weight="700" text-anchor="middle" fill="#374151">convolutional — y = K̄ ∗ x</text>
  <text x="735" y="290" font-size="11" text-anchor="middle" fill="#4B5563">K̄ = (CB̄, CĀB̄, CĀ²B̄, …) — one fixed kernel</text>
  <text x="735" y="310" font-size="11" text-anchor="middle" fill="#9E3528">needs: LTI — dead the moment Δ, B, C see the token</text>
  <text x="735" y="338" font-size="10.5" text-anchor="middle" fill="#6B7280">how S4 trained · Mamba gave this face up</text>

  <!-- equivalence bar between recurrent and conv -->
  <path d="M390,302 L566,302" stroke="#C9D1DB" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="478" y="294" font-size="9.5" text-anchor="middle" fill="#9CA3AF">same outputs, different schedule</text>

  <!-- bottom: SSD fourth face -->
  <path d="M225,362 C 260,400 330,418 400,424" stroke="#3E9E7B" stroke-width="1.8" fill="none" marker-end="url(#arrowT)"/>
  <rect x="216" y="396" width="170" height="16" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="0.8"/>
  <text x="301" y="408" font-size="9.5" text-anchor="middle" fill="#22624F">unroll again — needs only a scalar decay</text>
  <rect x="404" y="392" width="440" height="76" rx="12" fill="#A6E1CB" stroke="#3E9E7B" stroke-width="1.6" filter="url(#sgsoft)"/>
  <text x="624" y="416" font-size="12.5" font-weight="700" text-anchor="middle" fill="#14503D">SSD (Mamba-2) — y = (L ∘ CBᵀ)x, chunked matmuls</text>
  <text x="624" y="436" font-size="11" text-anchor="middle" fill="#14503D">parallel training WITHOUT going back to LTI</text>
  <text x="624" y="456" font-size="10.5" text-anchor="middle" fill="#22624F">the face Nemotron's 48 blocks train through (fig. 11)</text>

  <text x="928" y="486" font-size="10" font-style="italic" text-anchor="end" fill="#C0C5CD">faces: arXiv:2111.00396 (S4) · 2312.00752 (Mamba) · 2405.21060 (SSD)</text>
</svg>
