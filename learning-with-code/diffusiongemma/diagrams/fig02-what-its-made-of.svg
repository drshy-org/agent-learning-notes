<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700');text,tspan{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}</style><defs><filter id='sgsoft' x='-30%' y='-30%' width='160%' height='170%'><feDropShadow dx='0' dy='1.2' stdDeviation='2.4' flood-color='#1f2937' flood-opacity='0.09'/></filter></defs>
  <title>What DiffusionGemma is made of</title>
  <desc>DiffusionGemma is the Gemma-4 transformer (embeddings, RoPE, GQA, RMSNorm+GeGLU MLP, MoE, KV cache) plus a diffusion algorithm (random-token canvas, linear schedule, denoise loop, entropy acceptance, temperature anneal, early stop) joined by glue parts (bidirectional vs causal masks, block-commit to KV cache, self-conditioning).</desc>

  <rect x="4" y="4" width="952" height="532" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="32" y="40" font-size="19" font-weight="700" fill="#111827">What <tspan fill="#3E9E7B">DiffusionGemma</tspan> is made of</text>
  <text x="32" y="60" font-size="12" fill="#6B7280">= a Gemma-4 transformer  +  a diffusion algorithm  +  the glue that fuses them</text>

  <!-- Column A: transformer -->
  <text x="40" y="92" font-size="13.5" font-weight="700" fill="#2F7D67">① Gemma-4 transformer  ·  ×30 layers</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="40" y="104" width="278" height="30" rx="10" fill="#E4F5EE" stroke="#8ECCB6" filter="url(#sgsoft)"/><text x="179" y="123" fill="#22624F">Embeddings · tied in/out</text>
    <rect x="40" y="142" width="278" height="30" rx="10" fill="#E4F5EE" stroke="#8ECCB6" filter="url(#sgsoft)"/><text x="179" y="161" fill="#22624F">RoPE · partial rotary</text>
    <rect x="40" y="180" width="278" height="30" rx="10" fill="#E4F5EE" stroke="#8ECCB6" filter="url(#sgsoft)"/><text x="179" y="199" fill="#22624F">GQA · 16 Q / 8 KV · QK-norm</text>
    <rect x="40" y="218" width="278" height="30" rx="10" fill="#E4F5EE" stroke="#8ECCB6" filter="url(#sgsoft)"/><text x="179" y="237" fill="#22624F">RMSNorm + GeGLU MLP</text>
    <rect x="40" y="256" width="278" height="30" rx="10" fill="#E4F5EE" stroke="#8ECCB6" filter="url(#sgsoft)"/><text x="179" y="275" fill="#22624F">MoE · 128 experts · top-8</text>
    <rect x="40" y="294" width="278" height="30" rx="10" fill="#E4F5EE" stroke="#8ECCB6" filter="url(#sgsoft)"/><text x="179" y="313" fill="#22624F">KV cache · ring buffer</text>
  </g>

  <!-- Column B: diffusion -->
  <text x="341" y="92" font-size="13.5" font-weight="700" fill="#9E3528">② Diffusion algorithm</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="341" y="104" width="278" height="30" rx="10" fill="#FBDDD9" stroke="#D98A80" filter="url(#sgsoft)"/><text x="480" y="123" fill="#9E3528">Random-token canvas (256)</text>
    <rect x="341" y="142" width="278" height="30" rx="10" fill="#FBDDD9" stroke="#D98A80" filter="url(#sgsoft)"/><text x="480" y="161" fill="#9E3528">Linear noise schedule</text>
    <rect x="341" y="180" width="278" height="30" rx="10" fill="#FBDDD9" stroke="#D98A80" filter="url(#sgsoft)"/><text x="480" y="199" fill="#9E3528">Denoise loop · N passes</text>
    <rect x="341" y="218" width="278" height="30" rx="10" fill="#FBDDD9" stroke="#D98A80" filter="url(#sgsoft)"/><text x="480" y="237" fill="#9E3528">Entropy-based acceptance</text>
    <rect x="341" y="256" width="278" height="30" rx="10" fill="#FBDDD9" stroke="#D98A80" filter="url(#sgsoft)"/><text x="480" y="275" fill="#9E3528">Temperature anneal 0.8→0.4</text>
    <rect x="341" y="294" width="278" height="30" rx="10" fill="#FBDDD9" stroke="#D98A80" filter="url(#sgsoft)"/><text x="480" y="313" fill="#9E3528">Early stop</text>
  </g>

  <!-- Column C: weld -->
  <text x="642" y="92" font-size="13.5" font-weight="700" fill="#6B4FA8">③ The weld (glue)</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="642" y="104" width="278" height="30" rx="10" fill="#E7D6FA" stroke="#9E62D6" filter="url(#sgsoft)"/><text x="781" y="123" fill="#56409A">Bidirectional vs causal masks</text>
    <rect x="642" y="142" width="278" height="30" rx="10" fill="#E7D6FA" stroke="#9E62D6" filter="url(#sgsoft)"/><text x="781" y="161" fill="#56409A">Block-commit → KV cache</text>
    <rect x="642" y="180" width="278" height="30" rx="10" fill="#E7D6FA" stroke="#9E62D6" filter="url(#sgsoft)"/><text x="781" y="199" fill="#56409A">Self-conditioning</text>
  </g>
  <text x="781" y="246" font-size="11" text-anchor="middle" fill="#9CA3AF">these three reuse the same</text>
  <text x="781" y="262" font-size="11" text-anchor="middle" fill="#9CA3AF">transformer — only the masks</text>
  <text x="781" y="278" font-size="11" text-anchor="middle" fill="#9CA3AF">and feedback differ</text>

  <!-- combine bar -->
  <rect x="40" y="356" width="880" height="46" rx="10" fill="#F3F4F6" stroke="#D1D5DB" filter="url(#sgsoft)"/>
  <text x="480" y="377" font-size="13.5" font-weight="700" text-anchor="middle" fill="#374151">= DiffusionGemma 26B-A4B</text>
  <text x="480" y="393" font-size="11.5" text-anchor="middle" fill="#6B7280">block diffusion — diffusion WITHIN a 256-token block, autoregression ACROSS blocks</text>

  <!-- legend -->
  <line x1="40" y1="430" x2="920" y2="430" stroke="#EDEFF2"/>
  <rect x="40" y="450" width="14" height="14" rx="3" fill="#E4F5EE" stroke="#8ECCB6"/><text x="62" y="462" font-size="11.5" fill="#4B5563">reused from Gemma-4</text>
  <rect x="260" y="450" width="14" height="14" rx="3" fill="#FBDDD9" stroke="#D98A80"/><text x="282" y="462" font-size="11.5" fill="#4B5563">diffusion-specific</text>
  <rect x="460" y="450" width="14" height="14" rx="3" fill="#E7D6FA" stroke="#9E62D6"/><text x="482" y="462" font-size="11.5" fill="#4B5563">the glue that fuses them</text>

  <text x="40" y="500" font-size="10.5" font-style="italic" fill="#9CA3AF">Config from gemma/gm/nn/gemma4/_gemma4.py (Gemma4_26B_A4B); diffusion parts from gemma/diffusion/_sampler.py &amp; _transformer.py.</text>
</svg>
