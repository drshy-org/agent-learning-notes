<rect width="1060" height="520" rx="26" fill="#F5F5F7"/>
<rect x="28" y="26" width="691.5" height="40" rx="10" fill="#1D1D1F"/><text x="46" y="52" font-size="17" font-weight="700" fill="#FFFFFF">Best Paper - three old words, one insight (S4, ByteDance)</text>
<text x="80" y="104" font-size="13.5" font-weight="700" fill="#1D1D1F" text-anchor="start">the insight: storage is reactive, but the training workload is DETERMINISTIC - so tell storage the future</text>
