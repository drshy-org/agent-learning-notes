<svg viewBox="0 0 1060 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,sans-serif" role="img" aria-label="fig03-below">
<defs><filter id="ds-fig03-below" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.10"/></filter></defs>
<rect width="1060" height="470" rx="26" fill="#F5F5F7"/>
<rect x="28" y="26" width="611.0" height="40" rx="10" fill="#1D1D1F"/><text x="46" y="52" font-size="17" font-weight="700" fill="#FFFFFF">Below the allocator - two words change hands (S25)</text>
<rect x="70" y="100" width="440" height="290" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig03-below)"/>
<circle cx="70" cy="100" r="14" fill="#FF3B30" stroke="#FFFFFF" stroke-width="2.5"/><text x="70" y="104.5" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">M</text>
<text x="96" y="130" font-size="15" font-weight="800" fill="#1D1D1F" text-anchor="start">MoonBright - who writes the page table?</text>
<text x="96" y="156" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">before: host driver, serial, milliseconds</text>
<rect x="96" y="170" width="210" height="22" rx="11" fill="#8E8E93"/><text x="201.0" y="185" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CPU driver writes PTEs</text>
<line x1="210" y1="208" x2="210.0" y2="229.0" stroke="#1D1D1F" stroke-width="2.5"/><polygon points="210,240 204.5,229.0 215.5,229.0" fill="#1D1D1F"/>
<rect x="96" y="246" width="250" height="22" rx="11" fill="#FF3B30"/><text x="221.0" y="261" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">GPU kernel writes its own PTEs</text>
<text x="96" y="296" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">page-table build = data-parallel workload</text>
<text x="96" y="322" font-size="14" font-weight="700" fill="#FF9500" text-anchor="start">2 GB mapping: 36 ms -&gt; 14 us  (&gt;2,500x)</text>
<text x="96" y="348" font-size="12.5" font-weight="400" fill="#86868B" text-anchor="start">Always-Fresh VA: no stale entry can exist,</text>
<text x="96" y="366" font-size="12.5" font-weight="400" fill="#86868B" text-anchor="start">TLB shootdown deferred to epoch rollover</text>
<rect x="560" y="100" width="440" height="290" rx="14" fill="#FFFFFF" stroke="#E2E2E7" stroke-width="1" filter="url(#ds-fig03-below)"/>
<circle cx="560" cy="100" r="14" fill="#FF3B30" stroke="#FFFFFF" stroke-width="2.5"/><text x="560" y="104.5" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">N</text>
<text x="586" y="130" font-size="15" font-weight="800" fill="#1D1D1F" text-anchor="start">Nixie - who gets the GPU this second?</text>
<text x="586" y="156" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">the 'process' being time-shared:</text>
<rect x="586" y="170" width="170" height="22" rx="11" fill="#FF3B30"/><text x="671.0" y="185" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">a 24 GB local LLM</text>
<text x="586" y="216" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">MLFQ + time slices + working sets, intact;</text>
<text x="586" y="236" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">exactly ONE copy per chunk in the whole hierarchy</text>
<text x="586" y="266" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">no UVM shadow pages -&gt;</text>
<text x="586" y="292" font-size="14" font-weight="700" fill="#FF9500" text-anchor="start">pinned mem ~1/3 of UVM, TTFT -44-82% (Ollama)</text>
<text x="586" y="324" font-size="12.5" font-weight="400" fill="#86868B" text-anchor="start">idleness inferred from 100 ms of API silence -</text>
<text x="586" y="342" font-size="12.5" font-weight="400" fill="#86868B" text-anchor="start">the scheduler cannot see a GPU 'block'</text>
<rect x="70" y="416" width="230" height="22" rx="11" fill="#007AFF"/><text x="185.0" y="431" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">old word: page table / TLB</text>
<rect x="560" y="416" width="300" height="22" rx="11" fill="#007AFF"/><text x="710.0" y="431" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">old word: time-sharing / MLFQ / swap</text>
</svg>